{t:10,p:"Per a focs de classe B, l'agua polvoritzada és acceptable únicament quan:",o:["A) El líquid és insoluble en agua (benzina, gasoil, fuel)","B) El punt d'inflamació del líquid és superior a 38°C","C) El líquid és soluble en agua i el foc és de petita dimensió","D) L'agua polvoritzada no és acceptable per a cap foc de classe B"],c:1,e:"L'agua polvoritzada és ACCEPTABLE per a focs de classe B quan el punt d'inflamació del líquid és SUPERIOR a 38°C (per exemple, fuel, oli lubrificant). Per a líquids amb punt d'inflamació baix (benzina < 38°C), l'agua polvoritzada no és segura."},
{t:10,p:"L'HFC-227ea, un gas halocarbonat substitut dels halons, té una concentració extintora de:",o:["A) 2-3%","B) 5-7,1%","C) 12-16%","D) 30-38%"],c:1,e:"HFC-227ea: concentració extintora del 5-7,1%. L'HFC-23 necessita 12-16%, molt superior. El CO₂ necessita 30-38%. Els halocarbonats son més eficaços que el CO₂ però menys que els halons originals amb brom."},
// TEMA 12
{t:12,p:"Quin significat té l'acrònim NRBQ?",o:["A) Nuclear, Radiològic, Biològic i Químic","B) Nuclear, Reactiu, Biohazard i Químic","C) Neurotòxic, Radioactiu, Bacteriològic i Quotidià","D) Nuclear, Residual, Biològic i Qualificat"],c:0,e:"NRBQ = Nuclear, Radiològic, Biològic i Químic. Quatre categories de risc que comparteixen que el perill pot ser invisible i que l'actuació depèn de la identitat de l'agent."},
{t:12,p:"Quina és la definició de risc tecnològic?",o:["A) La probabilitat que una instal·lació industrial causi danys, calculable matemàticament","B) El risc derivat de l'ús de maquinària pesada en entorns laborals","C) La possibilitat que es donin conseqüències indesitjables derivades d'un esdeveniment relacionat amb l'accés o l'ús de la tecnologia, l'aparició del qual no es pugui determinar a priori","D) El conjunt de perills associats al transport de mercaderies perilloses"],c:2,e:"Definició exacta: 'La possibilitat que es donin conseqüències indesitjables derivades d'un esdeveniment relacionat amb l'accés o l'ús de la tecnologia i la aparició del qual no es pugui determinar a priori.'"},
{t:12,p:"En un àtom, el nombre de protons determina:",o:["A) El número atòmic (Z), que identifica de quin element químic es tracta","B) El número màssic (A), que indica el pes total de l'àtom","C) La càrrega neta de l'àtom","D) La quantitat d'energia de la capa exterior"],c:0,e:"Nombre de protons = NÚMERO ATÒMIC (Z) = identifica l'element. Si Z=1 és hidrogen; Z=17 és clor. El número màssic (A) = protons + neutrons."},
{t:12,p:"La regla de l'octet estableix que els àtoms tendeixen a:",o:["A) Tenir el màxim de protons possible per assolir estabilitat","B) Compartir exactament 8 protons amb altres àtoms en els enllaços","C) Tenir 8 electrons a la seva capa exterior per assolir estabilitat química màxima","D) Formar molècules amb exactament 8 àtoms en la seva estructura"],c:2,e:"Regla de l'octet: els àtoms tendeixen a tenir 8 electrons a la capa exterior (de valència) per assolir l'estabilitat dels gasos nobles."},
{t:12,p:"Dos àtoms d'un mateix element que difereixen en el nombre de neutrons s'anomenen:",o:["A) Al·lòtrops","B) Isòtops","C) Isòmers","D) Ions"],c:1,e:"ISÒTOPS: mateixa Z (mateixos protons = mateix element) però diferent A (diferent nombre de neutrons). Exemple: Urani-235 i Urani-238. Els isòtops inestables emeten radiació."},
{t:12,p:"La radioactivitat és el fenomen pel qual:",o:["A) Un àtom perd electrons de la capa exterior en reaccionar amb un oxidant","B) Un element canvia les seves propietats per efecte de la temperatura","C) Dos àtoms del mateix element reaccionen violentament en entrar en contacte","D) Un nucli atòmic inestable emet radiació espontàniament per assolir estabilitat"],c:3,e:"Radioactivitat = emissió espontània de radiació (alfa, beta o gamma) per part d'un nucli atòmic inestable, com a mecanisme per alliberar energia i assolir estabilitat."},
{t:12,p:"Quina normativa sobre residus és la vigent a Espanya des del 2022?",o:["A) La Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular","B) La Ley 22/2011, de 28 de julio, de residuos y suelos contaminados","C) La Ley 20/1986, de 14 de mayo, Básica de Residuos Tóxicos y Peligrosos","D) El RD 833/1988 sobre residus tòxics i perillosos"],c:0,e:"Normativa vigent: Ley 7/2022, de 8 de abril (substitueix la Ley 22/2011). La Ley 20/1986 fa temps que està derogada. Per a l'examen 2026, la referència vàlida és la Ley 7/2022."},
{t:12,p:"Quin sistema d'etiquetatge de substàncies perilloses és el vigent a la UE?",o:["A) El sistema de pictogrames taronja (Directiva 67/548/CEE) amb símbols E, O, F, T","B) El sistema NFPA 704 (diamant de Hazchem) adoptat per la UE el 2010","C) El GHS / Reglament CLP (CE) 1272/2008, amb pictogrames en rombes vermells amb fons blanc","D) El sistema de codis de color ADR exclusivament"],c:2,e:"Sistema vigent: GHS / Reglament CLP 1272/2008 (aplicat des de 2015). Pictogrames en rombes vermells amb fons blanc i símbol negre. Els pictogrames taronja antics estan derogats."},
{t:12,p:"De quants dígits es composen els codis LER (Llista Europea de Residus)?",o:["A) 4 dígits","B) 6 dígits","C) 8 dígits","D) 10 dígits"],c:1,e:"Codis LER = 6 dígits, que identifiquen l'origen i naturalesa del residu perillós."},
{t:12,p:"El fenomen BLEVE és:",o:["A) Un tipus d'explosió de núvol de vapor no confinat en espais oberts","B) Un incendi en el qual el combustible és un gas liquat que s'allibera progressivament","C) La propagació sobtada d'un incendi a tots els materials del compartiment","D) L'explosió d'un recipient amb líquid a pressió quan falla mecànicament, amb vaporització i expansió explosiva del contingut"],c:3,e:"BLEVE (Boiling Liquid Expanding Vapour Explosion): recipient amb líquid a pressió s'escalfa per un incendi exterior → pressió interna augmenta → el recipient falla → el líquid es vaporitza i s'expandeix explosivament."},
{t:12,p:"Quina reacció perillosa es produeix en barrejar lleixiu (hipoclorit de sodi) amb salfumà (àcid clorhídric)?",o:["A) Alliberament de clor gas (Cl₂), altament tòxic","B) Formació de cloramines, menys tòxiques que el clor","C) Reacció exotèrmica inofensiva amb formació de sal (NaCl)","D) Formació d'àcid hipoclorós, irritant però no letal"],c:0,e:"Lleixiu + salfumà → clor gas (Cl₂) + NaCl + H₂O. El Cl₂ és altament tòxic. Nota: lleixiu + amoníac → cloramines (reacció diferent)."},
{t:12,p:"Si la densitat relativa del vapor d'una substància és superior a 1, la implicació tàctica és:",o:["A) El vapor s'elevarà i es dispersarà ràpidament","B) La substància és més soluble en agua i es pot diluir eficaçment","C) El vapor és més pesat que l'aire i tendirà a acumular-se en zones baixes, soterranis i desaigues","D) La substància és més volàtil i forma un núvol de propagació ràpida"],c:2,e:"Densitat relativa del vapor >1 → vapor més pesat que l'aire → s'acumula en zones BAIXES. Densitat <1 → s'eleva i es dispersa. Clau per decidir on cercar concentracions de vapor."},
{t:12,p:"L'ADR és la normativa que regula:",o:["A) L'emmagatzematge de productes químics perillosos en naus industrials","B) El transport de mercaderies perilloses per carretera a nivell internacional","C) El transport de materials radioactius per via aèria","D) La classificació i etiquetatge de substàncies al lloc de treball"],c:1,e:"ADR (Accord européen relatif au transport international des marchandises Dangereuses par Route) = transport de mercaderies perilloses per CARRETERA. RID = ferrocarril; IMDG = marítim; IATA/OACI = aeri."},
{t:12,p:"Per quina raó els riscos radiològics son més FREQÜENTS que els nuclears?",o:["A) Perquè les centrals nuclears estan molt ben protegides i rarament fallen","B) Perquè les fonts radioactives s'usen en hospitals, indústria i investigació i es transporten contínuament","C) Perquè els accidents nuclears estan prohibits per normativa internacional","D) Perquè la radioactivitat natural del sòl genera incidents constantment"],c:1,e:"Fonts radioactives no confinades a centrals: s'usen en medicina (radioteràpia), indústria (gammagrafia) i investigació. Cada trasllat és una oportunitat d'incident. Molt més freqüents que els nuclears."},
{t:12,p:"Quina és la primera decisió operativa crítica que diferencia un escenari NRBQ d'un incendi convencional?",o:["A) Identificar el producte i el seu comportament ABANS de decidir com actuar, perquè el perill pot ser invisible i la resposta depèn del producte","B) Activar immediatament el sistema d'extinció amb agua polvoritzada, segura per a la majoria de productes","C) Establir un perímetre de seguretat de 500 metres en tots els casos","D) Evacuar tots els civils de la zona i esperar instruccions del CECOP"],c:0,e:"En un NRBQ, la primera decisió NO és 'com actuo' sinó 'QUÈ és això i COM es comporta'. El perill pot ser invisible, els efectes retardats, i l'actuació depèn totalment del producte."},
// TEMA 12 — preguntes addicionals dificultat alta
{t:12,p:"Si es dobla la distància respecte a una font radioactiva, en quina proporció es redueix la dosi rebuda, segons el principi ALARA?",o:["A) Es redueix a la meitat","B) Es redueix a la tercera part","C) Es redueix a la quarta part (la dosi disminueix amb el quadrat de la distància)","D) Es redueix al 10%"],c:2,e:"La dosi disminueix amb el QUADRAT de la distància: doblar la distència → la dosi es redueix a 1/4. Triplicar-la → 1/9. La distència és el principi ALARA més senzill d'aplicar immediatament sobre el terreny, sense cap equipament."},
{t:12,p:"La diferència clau entre una persona IRRADIADA i una de CONTAMINADA en un escenari radiològic és:",o:["A) La irradiada ha rebut una dosi major de radiació que la contaminada","B) La contaminada ha estat exposada a radiació gamma; la irradiada, a radiació alfa","C) La irradiada NO porta material radioactiu a sobre i no contamina a tercers; la contaminada porta partícules adherides i pot transmetre-les a altres persones o superfícies","D) La contaminada es pot tractar mèdicament; la irradiada no"],c:2,e:"IRRADIAT: ha rebut energia de radiació, però no porta material radioactiu → no contamina a tercers, no cal descontaminació. CONTAMINAT: porta partícules radioactives adherides → pot transmetre-les → cal protocol de descontaminació complet."},
{t:12,p:"La radiació ALFA es caracteritza per:",o:["A) Ser la més penetrant de totes les radiacions ionitzants","B) Requerir blindatge de plom o formigó per ser atenuada","C) Tenir molt baixa penetració (atura un full de paper), però ser especialment perillosa per contaminació INTERNA (ingestió o inhalació)","D) Travessar qualsevol material excepte l'acer inoxidable"],c:2,e:"Radiació ALFA: molt baixa penetració (l'atura la pell o un full de paper). Perill EXTERN: molt baix. Perill INTERN: molt alt, si s'inhala o s'ingereix material emissors alfa. El contaminant entra dins del cos i irradia teixits des de dins."},
{t:12,p:"Per blindar eficaçment la radiació GAMMA i els raigs X, quin material és necessari?",o:["A) Un full de paper o cartró","B) Una làmina fina de metall o plàstic","C) Materials rics en hidrogen (agua, parafina, polietilè)","D) Blindatge dens com el plom o el formigó armat"],c:3,e:"Radiació GAMMA / Raigs X: alta penetració, travessen el cos i la majoria de materials. Requereix blindatge DENS: PLOM o FORMIGÓ armat. Les làmines de metall o plàstic (útils per beta) son insuficients per gamma."},
{t:12,p:"Per aturar la radiació de NEUTRONS, quin tipus de material és el més eficaç?",o:["A) Plom d'alta densitat","B) Formigó armat de gran gruix","C) Materials rics en hidrogen, com l'agua o la parafina","D) Acer inoxidable d'alta resistència estructural"],c:2,e:"Neutrons: alta penetració. S'aturen millor amb MATERIALS RICS EN HIDROGEN (agua, parafina, polietilè), perquè els neutrons xoquen eficaçment amb nuclis d'hidrogen (masses similars) i perden energia ràpidament."},
{t:12,p:"Per quin motiu els metalls ALCALINS (sodi, potassi, liti) reaccionen violentament amb l'agua alliberant hidrogen inflamable?",o:["A) Perquè tenen la capa de valència completa i la volen mantenir","B) Perquè tenen 7 electrons a la capa exterior i en capten un de l'agua","C) Perquè tenen un sol electró a la capa exterior que cedeixen fàcilment (tendència fortíssima a perdre'l), alliberant H₂ inflamable com a subproducte","D) Perquè la seva temperatura d'autoignició és inferior a la de l'agua"],c:2,e:"Metalls alcalins (Na, K, Li): 1 ELECTRÓ a la capa de valència → tendència fortíssima a perdre'l. En cedir-lo a l'agua, es genera H₂ (inflamable/explosiu) i bases fortes (NaOH, KOH). MAI s'usa agua per extingir focs de metalls alcalins."},
{t:12,p:"Per quin motiu els gasos nobles (He, Ne, Ar) son pràcticament inerts i s'usen com a atmosferes protectores en soldadura?",o:["A) Perquè son gasos i no poden reaccionar amb sòlids ni líquids en condicions normals","B) Perquè la seva massa molecular és tan elevada que no poden penetrar en cap xarxa cristal·lina","C) Perquè la seva temperatura d'ebullició és molt baixa, el que els fa volàtils i dispersables","D) Perquè ja tenen 8 electrons a la capa de valència (octet complet, 2 en He) i no 'necessiten' interactuar amb cap altre àtom"],c:3,e:"Gasos nobles: OCTET COMPLET (8 electrons a la capa exterior, 2 en el cas de l'He). Ja son estables tal com son → no guanyen ni perden electrons → no formen compostos → inerts. Per això s'usen com a atmosferes protectores on no es vol cap reacció química."},
{t:12,p:"Un gas amb densitat relativa de vapor de 1,5 (com el propà) en cas de fuita en un espai confinat:",o:["A) Ascendirà i es dispersarà per la part alta del recinte","B) Es distribuirà de forma homogènia per tot el recinte en menys d'un minut","C) S'acumularà en zones baixes (rases, soterranis, desguassos) per ser més pesat que l'aire","D) Es dissoldrà en la humitat ambiental i deixarà de ser inflamable"],c:2,e:"Propà: densitat relativa ~1,5 (>1) → MÉS PESAT que l'aire → s'acumula en ZONES BAIXES. Implicació operativa: mai aproximar-se per zones baixes ni entrar en espais confinats baixos sense mesurar l'atmosfera prèviament."},
{t:12,p:"El metà (gas natural) té una densitat relativa de vapor de ~0,6. Quina implicació operativa en deriva?",o:["A) S'acumula en soterranis i zones baixes per ser lleuger","B) Forma núvols de vapor a ras de sòl perquè s'atura a la capa límit atmosfèrica","C) Ascendeix i es dispersa per la part alta del recinte o cap a l'exterior si hi ha obertures altes","D) La seva baixa densitat el fa inert respecte a les corrents d'aire en espais tancats"],c:2,e:"Metà: densitat relativa ~0,6 (<1) → MÉS LLEUGER que l'aire → ascendeix i es dispersa per les zones ALTES. Risc principal: acumulació al sostre o en espais alts tancats. Si hi ha fuita, ventilar per dalt."},
{t:12,p:"Un líquid hidròfob com la gasolina, en cas de vessament sobre una superfície amb agua:",o:["A) Es dissoldrà en l'agua dels desguassos, reduint la seva concentració i perillositat","B) Formarà una solució aquosa que cal neutralitzar químicament abans de recollir-la","C) No es dissoldrà en l'agua (similars dissolen similars): SURA sobre l'agua i s'escampa; cal contenir-lo mecànicament","D) Reaccionarà amb l'agua formant un gas tòxic alliberat a l'atmosfera"],c:2,e:"Gasolina = apolar, HIDRÒFOBA → no es dissol en agua (polar). SURA sobre l'agua (densitat <1) i s'escampa en superfície. Estratègia: contenció mecànica (barreres, absorbents), no dilució. La dilució és per a substàncies HIDRÒFILES."},
{t:12,p:"La posada a terra obligatòria de les cisternes de líquids inflamables durant càrrega i descàrrega existeix per evitar:",o:["A) Que la cisterna transmeti electricitat de la xarxa al vehicle durant el procés","B) L'acumulació de càrrega electrostàtica generada pel flux del líquid, que podria generar una espurna i provocar la ignició","C) L'oxidació galvànica de la cisterna per efecte de la humitat del terreny","D) Que el producte quedi carregat elèctricament i dificulti la seva combustió"],c:1,e:"Líquids inflamables i apolars: MALS CONDUCTORS → acumulen CÀRREGA ELECTROSTÀTICA en circular per canonades. Una espurna elèctrica pot inflamar el vapor. Per això les cisternes i el terminal de càrrega s'interconnecten i es posen a terra obligatòriament."},
{t:12,p:"El gas sulfhídric (H₂S) presenta un risc insidiós particular. Quin és?",o:["A) És el gas inflamable amb LII més baix de tots els habituals en accidents industrials","B) La seva densitat molt baixa el fa ascendir invisiblement fins a zones on el personal no el detecta","C) A concentracions altes, ANESTESIA el sentit de l'olfacte: l'absència d'olor NO garanteix absència de risc letal","D) Reacciona amb els filtres de l'equip de protecció respiratòria inutilitzant-los en qüestió de minuts"],c:2,e:"H₂S: olor característica a ou podrit en concentracions baixes. A concentracions ALTES, PARALITZA els receptors olfactius: el personal no detecta l'olor tot i estar en ambient letal. La norma: mai confiar en l'olfacte com a mètode de detecció de H₂S."},
{t:12,p:"El cianur d'hidrogen (HCN) és un asfixiant QUÍMIC. En qué es diferencia d'un asfixiant simple com el CO₂?",o:["A) L'HCN desplaça físicament l'oxigen de l'atmosfera, igual que el CO₂ però de forma més ràpida","B) L'HCN inhibeix la citocrom oxidasa mitocondrial, bloquejant la respiració cel·lular independentment de l'O₂ disponible en sang","C) Son equivalents en mecanisme d'acció; la diferència és únicament la velocitat","D) L'HCN és asfixiant simple en concentracions baixes i químic en concentracions altes"],c:1,e:"CO₂ = asfixiant SIMPLE: desplaça l'O₂ de l'atmosfera. HCN = asfixiant QUÍMIC: inhibeix la CITOCROM OXIDASA MITOCONDRIAL, bloquejant la respiració a nivell CEL·LULAR. Fins i tot amb O₂ abundant en sang, les cèl·lules no el poden usar → mort ràpida."},
{t:12,p:"L'acroleïna (generada en piròlisi de certs plàstics i olis) té densitat relativa de 1,9. Quina implicació operativa en deriva directament?",o:["A) Ascendirà al sostre i s'acumularà en la capa de gasos calents","B) Es dispersarà homogèniament i no représenta risc concentrat en cap zona concreta","C) Per ser menys densa que l'aire, no requereix protecció específica a nivell del sòl","D) S'acumularà en les zones BAIXES de l'espai, representant risc per al personal que progressa a nivell del sòl o en espais confinats baixos"],c:3,e:"Acroleïna: densitat relativa = 1,9 → MÉS PESADA que l'aire → s'acumula en ZONES BAIXES. Gas molt tòxic i irritant. Risc especial per a personal que progressa arrossegant-se (tècnica habitual en incendis) o en fossats, rases i soterranis."},
{t:12,p:"En un BLEVE, quin punt del recipient es debilita MÉS RÀPIDAMENT quan la flama incideix directament sobre ell?",o:["A) La vàlvula de seguretat (punt de menor resistència mecànica)","B) La part inferior en contacte directe amb la flama","C) La part SUPERIOR (fase de vapor), on el líquid interior no hi és per absorbir calor i refredar la paret metàl·lica des de dins","D) Les soldadures longitudinals laterals del recipient"],c:2,e:"Part SUPERIOR = fase de vapor: el líquid no la cobreix des de dins → no hi ha evaporació que absorbeixi calor → la paret metàl·lica s'escalfa molt més ràpid → perd resistència mecànica → punt crític de fallada. Mesura: refredar TOTA la superfície, especialment la superior."},
{t:12,p:"Per quin motiu és especialment perillós apagar la flama d'una fuita de GLP SENSE tallar prèviament el subministrament?",o:["A) Perquè l'extinció refreda sobtadament el gas i n'augmenta la pressió interna fins al BLEVE","B) Perquè es crea una atmosfera explosiva sense font d'ignició visible: pitjor que tenir una flama controlada","C) Perquè les eines d'extinció convencionals no son eficaces sobre gasos a pressió elevada","D) Perquè l'extinció provoca un canvi d'estat del GLP que multiplica el volum del gas fins a 500 vegades"],c:1,e:"Apagar la flama sense tallar el gas → el gas continua sortint, s'acumula i forma una ATMOSFERA EXPLOSIVA sense punt d'ignició visible. Qualsevol espurna posterior (motor, llum, estàtica) la pot detonar. La flama controlada en un punt fixe és preferible a un núvol explosiu invisible."},
{t:12,p:"Per quin motiu el grau d'ompliment d'una cisterna de GLP és del 85% i no del 100%?",o:["A) Per facilitar les operacions de buidat i control de qualitat","B) Perquè el 15% restant és vapor de gas necessari per mantenir la pressió de servei","C) El líquid es DILATA amb la calor; si la cisterna s'omplís al 100%, la dilatació tèrmica sense marge de vapor dispararia la pressió interna fins a la fallada mecànica","D) Perquè el pes màxim admès per llei no permet omplir per sobre del 85% en vehicles de transport"],c:2,e:"El marge del 15% no és un descuit: és el MARGE DE SEGURETAT TÈRMICA. Un líquid es dilata amb la temperatura. Si no hi ha espai de vapor per absorbir la dilatació, la pressió interna es dispara. GLP 85%, gasoil 97%, O₂ líquid 98% (cada producte té el seu marge)."},
{t:12,p:"La pressió màxima de servei d'una cisterna NO pot ser inferior a quina referència clau?",o:["A) La pressió nominal de la bomba de càrrega del producte","B) La tensió de vapor del producte a 50°C (escenari tèrmic més desfavorable previsible)","C) La pressió atmosfèrica estàndard multiplicada per 2 (marge de seguretat doble)","D) La tensió de vapor del producte a temperatura ambient (20°C)"],c:1,e:"La cisterna s'ha de dissenyar per al PITJOR ESCENARI PREVISIBLE: un dia molt calorós (50°C). La pressió màxima de servei no pot ser inferior a la tensió de vapor del producte a 50°C. Dissenyar per a condicions mitjanes (20°C) seria insuficient i perillós."},
{t:12,p:"Un jerricà ('cuñete') per al transport de mercaderies perilloses té una capacitat màxima de:",o:["A) 400 kg o 200 L","B) 200 kg o 200 L","C) 60 L o 120 kg","D) 100 L o 200 kg"],c:2,e:"Jerricà (cuñete): secció rectangular/poligonal, un o diversos orificis. Capacitat màxima = 60 L o 120 kg. A diferència del bidó (cilíndric, fins a 400 kg). Ambdós son "bultos" (mercaderia envasada individualment)."},
{t:12,p:"Un bloc d'ampolles de gas TÒXIC (classe 2) té una capacitat total màxima de:",o:["A) 500 L","B) 1.000 L","C) 2.000 L","D) 3.000 L"],c:1,e:"Blocs d'ampolles: capacitat total màxima = 3.000 L en general. Si el gas és TÒXIC (classe 2), la capacitat màxima es redueix a 1.000 L. La restricció addicional per toxicitat respon al principi de minimitzar el risc en cas d'accident."},
{t:12,p:"La diferència entre un HIDRÀCID i un OXOÀCID és:",o:["A) Els hidràcids contenen oxigen; els oxoàcids no","B) Els oxoàcids CONTENEN OXIGEN en la seva molècula (H₂SO₄, HNO₃); els hidràcids NO (HCl, H₂S)","C) Els hidràcids son sempre gasos a temperatura ambient; els oxoàcids son sempre líquids","D) Els hidràcids son bases febles; els oxoàcids son àcids forts en tots els casos"],c:1,e:"HIDRÀCIDS: H + no-metall, SENSE oxigen (HCl = àcid clorhídric, H₂S = àcid sulfhídric). OXOÀCIDS: CONTENEN OXIGEN (H₂SO₄ = sulfúric, HNO₃ = nítric, HClO₄ = perclòric). Els oxoàcids solen tenir comportament oxidant afegit que els hidràcids no tenen."},
{t:12,p:"La reacció d'un àcid fort vessat sobre estructures metàl·liques actives (ferro, zinc, alumini) pot generar:",o:["A) Un gas oxidant que intensifica la corrosió de les estructures","B) Diòxid de carboni (CO₂), que dilata el recipient o l'espai tancat","C) Hidrogen (H₂): gas inflamable i explosiu que suposa un risc afegit a l'accident químic original","D) Oxigen, que pot alimentar una eventual ignició de materials propers"],c:2,e:"Àcid + metall actiu → SAL + HIDROGEN (H₂). L'H₂ és un gas inflamable/explosiu (LII = 4%, LSI = 75%). En un accident amb àcid sulfúric o clorhídric sobre estructures metàl·liques, pot generar-se H₂ en quantitats suficients per crear atmosfera explosiva."},
{t:12,p:"En les propietats dels fluids, la viscositat es comporta de manera oposada en líquids i gasos davant d'un augment de temperatura. Quina relació és correcta?",o:["A) En líquids i gasos, la viscositat disminueix amb la temperatura","B) En líquids, la viscositat augmenta amb la temperatura; en gasos, disminueix","C) En LÍQUIDS, la viscositat DISMINUEIX (l'oli calent flueix millor); en GASOS, AUGMENTA (més xocs moleculars)","D) En líquids i gasos, la viscositat augmenta amb la temperatura"],c:2,e:"LÍQUIDS: ↑T → ↓viscositat (menys cohesió entre molècules). GASOS: ↑T → ↑viscositat (més agitació molecular → més xocs → més resistència al moviment). Implicació: un líquid viscós calent s'escampa MÉS ràpid que fred → menys marge de contenció."},
{t:12,p:"La solubilitat dels GASOS en líquids varia amb la temperatura i la pressió de quina manera?",o:["A) Augmenta amb la temperatura i disminueix amb la pressió","B) Disminueix amb la temperatura i augmenta amb la pressió (com en una beguda gasosa que perd gas en escalfar-se o en obrir l'envàs)","C) Augmenta tant amb la temperatura com amb la pressió","D) No es veu afectada ni per la temperatura ni per la pressió"],c:1,e:"Gasos en líquids: ↑T → ↓solubilitat (perd gas). ↑P → ↑solubilitat (més gas dissolt). EXEMPLE: una beguda carbonada perd el CO₂ quan s'escalfa (↑T) o quan s'obre l'envàs (↓P). Implicació: un producte pressuritzat calent allibera gas amb més intensitat."},
{t:12,p:"El punt d'ebullició d'una substància química determina, tàcticament, quin aspecte en un escenari de vessament?",o:["A) La corrosivitat del producte sobre estructures metàl·liques","B) Si el producte és miscible en agua o no (polaritat)","C) La velocitat de formació de núvol de vapor: punt d'ebullició BAIX → vaporitza ràpid → núvol de vapor gran en poc temps","D) Si la substància és inflamable o no (LII)"],c:2,e:"PUNT D'EBULLICIÓ BAIX = passa fàcilment a vapor a temperatura ambient → núvol de vapor gran i ràpid → zona inflamable o tòxica s'expandeix de pressa. Punt d'ebullició ALT = vaporitza lentament → més marge de temps per contenir-lo com a líquid."},
{t:12,p:"Un pictograma de perillositat en forma quadrada de fons TARONJA correspon a:",o:["A) El sistema GHS/CLP vigent a la UE des de 2015 (Reglament CE 1272/2008)","B) El sistema de senyalització ADR per al transport per carretera (panell taronja)","C) El sistema ANTIC (Directiva 67/548/CEE), DEROGAT el 2015, que ja no és la referència vigent","D) La classificació de residus perillosos del codi LER actualitzat"],c:2,e:"Pictogrames quadrats TARONJA = sistema ANTIC de la Directiva 67/548/CEE (símbols E, O, F, F+, T, T+, Xn, Xi). DEROGAT des de 2015. Sistema VIGENT: GHS/CLP amb rombes VERMELLS fons BLANC. En examen, si pregunten sistema vigent = GHS/CLP = rombes vermells."},
{t:12,p:"El sistema GHS/CLP (Reglament CE 1272/2008) vigent a la UE des de 2015 utilitza pictogrames amb:",o:["A) Forma quadrada de fons taronja amb símbols negres","B) Forma circular de fons blanc amb franja vermella","C) Forma de rombe (quadrat sobre un vèrtex) de fons BLANC amb contorn VERMELL i símbol NEGRE","D) Forma triangular de fons groc amb símbol negre"],c:2,e:"GHS/CLP VIGENT: rombes (quadrats sobre vèrtex) amb FONS BLANC, CONTORN VERMELL i SÍMBOL NEGRE. Entre els símbols: bomba (explosius), flama (inflamables), flama sobre cercle (comburents), calavera i tíbies (toxicitat aguda), corrosió, ampolla de gas (pressió)."},
{t:12,p:"Quina norma sobre residus és l'ACTUAL a Espanya?",o:["A) Ley 20/1986, de 14 de mayo, Básica de Residuos Tóxicos y Peligrosos (derogada)","B) Ley 22/2011, de 28 de julio, de residuos y suelos contaminados (substituïda)","C) Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular","D) RD 833/1988 sobre residus tòxics i perillosos (derogat)"],c:2,e:"La norma VIGENT és la Ley 7/2022, de 8 d'abril. Va substituir la Ley 22/2011. La Ley 20/1986 i el RD 833/1988 fa anys que estan derogats. Per a l'examen 2026, la referència és la Ley 7/2022."},
{t:12,p:"La reactivitat dels HALÒGENS (fluor, clor, brom) és molt elevada. Quin és el motiu a nivell atòmic?",o:["A) Tenen 1 electró a la capa exterior i el cedeixen fàcilment, actuant com a agents reductors","B) Formen la primera columna de la taula periòdica i reaccionen violentament amb l'agua","C) Tenen 7 electrons a la capa exterior: en capten UN per completar l'octet → son OXIDANTS molt reactius (el clor 'roba' electrons, per exemple, dels teixits respiratoris)","D) Estan sempre en estat gasós i mai formen compostos estables a temperatura ambient"],c:2,e:"HALÒGENS (grup 17): 7 electrons a la capa exterior → els FALTA 1 per completar l'octet → tendència fortíssima a CAPTAR electrons d'altres àtoms → OXIDANTS poderosos. El FLUOR és el no-metall més reactiu de tots; el CLOR és habitual en accidents industrials."},
{t:12,p:"La tensió de vapor del propà comercial a 20°C és d'aproximadament 8,5 atmosferes. La del butà a 20°C és d'aproximadament 3 atmosferes. Quina implicació pràctica té aquesta diferència?",o:["A) El butà requereix cisternes de major resistència mecànica que el propà","B) La pressió interna d'una ampolla de propà és ~2,8 vegades major que la d'una de butà a igual temperatura → el propà treballa a estrès mecànic molt superior","C) La diferència és irrellevant per al disseny de recipients perquè les normes ADR les homogeneïtzen","D) El propà es transporta sempre en estat gasós; el butà en estat líquid, per la diferència de pressió"],c:1,e:"Propà: ~8,5 atm a 20°C. Butà: ~3 atm a 20°C. Una ampolla de PROPÀ treballa sotmesa a pressió interna ~2,8x superior a una de BUTÀ. Per això els recipients de propà necessiten parets de major resistència mecànica i son normalment metàl·lics (mai plàstic)."},
{t:12,p:"Un àtom que PERD electrons durant una reacció química queda amb càrrega positiva i s'anomena:",o:["A) Anió (càrrega negativa)","B) Isòtop de l'element original","C) Molècula apolar","D) Catió (càrrega positiva)"],c:3,e:"CATIÓ: àtom que HA PERDUT electrons → càrrega positiva (menys electrons que protons). ANIÓ: àtom que HA GUANYAT electrons → càrrega negativa. Exemples: Na⁺ (catió sodi), Cl⁻ (anió clorur). Fonamental per entendre la ionització i la conductivitat en solució."},
{t:12,p:"Les característiques de perillositat HP1 a HP15 dels residus perillosos a quina normativa corresponen?",o:["A) Als codis Kemler de l'ADR (transport per carretera)","B) Al Reglament (UE) 1357/2014, associat a la Ley 7/2022 vigent de residus","C) A la classificació ONU en 9 classes de mercaderies perilloses","D) A la normativa Seveso III sobre accidents greus en establiments industrials"],c:1,e:"Les característiques HP1-HP15 (explosiu, comburent, inflamable, irritant, nociu, tòxic, cancerigen, corrosiu, infecciós, mutagèn, ecotòxic...) son del Reglament (UE) 1357/2014, base de la Ley 7/2022 vigent. Un residu que en presenta una o més → residu PERILLÓS → gestió específica obligatòria."},
{t:12,p:"L'amoníac (NH₃) en dissolució aquosa forma una base de pH 8-11. Quin tipus de base és?",o:["A) Base FORTA, perquè el seu pH supera el valor 7 clarament","B) Base FEBLE, perquè es dissocia únicament de forma parcial en ions OH⁻ en dissolució","C) Àcid feble disfressat de base, perquè en algunes condicions el seu pH pot ser inferior a 7","D) Base NEUTRA per definició, perquè el seu pH mai supera el valor 12"],c:1,e:"NH₃ = BASE FEBLE: es dissocia PARCIALMENT en ions OH⁻. pH 8-11. Bases FORTES (NaOH, KOH): es dissocien quasi totalment, pH 12-14. La diferència és important perquè les bases fortes son molt més corrosives que les febles a igual concentració."},
{t:12,p:"En el transport de mercaderies perilloses, 'granel' es diferencia de 'bultos' i 'cisternes' perquè:",o:["A) El granel utilitza cisternes especials pressuritzades per a gasos liquats","B) En el granel, el propi vehicle fa la funció d'envàs per a SÒLIDS sense envasar (cereals, minerals, productes pulverulents perillosos)","C) El granel fa referència al transport en GRG/IBC de gran capacitat (fins a 3.000 L)","D) En el granel, la mercaderia va en ampolles i jerricans de gran format agrupades en paletes"],c:1,e:"Tres tipus de transport: BULTOS (mercaderia en recipients individuals: caixes, ampolles, bidons...), CISTERNES (el vehicle és l'envàs, per a gasos o líquids), GRANEL (el vehicle és l'envàs per a SÒLIDS sense envasar). Exemple: camió de ciment, sal o roca fosfatada."},
{t:12,p:"Quin és el LER (Llista Europea de Residus) i quants dígits té el codi que identifica cada residu?",o:["A) Una llista de codis de 4 dígits que identifica el tipus de transport del residu","B) Un sistema de codis de 6 dígits que identifica l'origen i la naturalesa de cada residu perillós","C) Un registre de 8 dígits basat en el número CAS de la substància perillosa","D) Una classificació de 3 dígits equivalent a la classificació ONU del Tema 11"],c:1,e:"LER (Llista Europea de Residus): codis de 6 DÍGITS que identifiquen l'origen i la naturalesa del residu. Exemple: 13 02 06* (olis sintètics de motors, transmissions i lubricants). L'asterisc (*) indica residu perillós. Format obligatori en documents de trasllat i etiquetes."}
];

// ESTAT
const S={screen:'home',mode:'tema',tema:null,numQ:15,qList:[],cur:0,score:0,sel:null,exp:false,hist:[]};

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}
function getQ(){const pool=S.mode==='simulacre'?Q:Q.filter(q=>q.t===S.tema);return shuffle(pool).slice(0,Math.min(S.numQ,pool.length));}

function render(){document.getElementById('app').innerHTML=S.screen==='home'?rHome():S.screen==='quiz'?rQuiz():rResult();bind();}

function rHome(){
  const ok=S.mode==='simulacre'||S.tema!==null;
  const ns=[10,15,20,25];
  return`<div style="padding-top:20px">
  <div style="text-align:center;margin-bottom:24px">
    <div style="font-size:52px">🚒</div>
    <h1 style="font-size:22px;font-weight:700;color:#f1f5f9;margin:10px 0 4px">Test Bomber</h1>
    <p style="font-size:13px;color:#64748b">Consell Insular de Mallorca &nbsp;·&nbsp; ${Q.length} preguntes</p>
  </div>
  <div class="card">
    <span class="label">Mode</span>
    <div class="mode-tog">
      <button class="mode-btn${S.mode==='tema'?' act':''}" data-a="mode" data-v="tema">Per Tema</button>
      <button class="mode-btn${S.mode==='simulacre'?' act':''}" data-a="mode" data-v="simulacre">Simulacre</button>
    </div>
    ${S.mode==='tema'?`
      <span class="label" style="margin-top:4px">Tema</span>
      ${Object.entries(TI).map(([id,t])=>`<button class="theme-btn${S.tema==id?' sel':''}" data-a="tema" data-v="${id}"><span style="font-size:20px">${t.e}</span><div><strong>${t.n}</strong><span class="sub"> — ${t.d}</span></div></button>`).join('')}
    `:`<div style="background:#0f172a;border-radius:10px;padding:12px;font-size:13px;color:#64748b;line-height:1.8">✅ Tots els temes barrejats<br>${Object.values(TI).map(t=>`${t.e} ${t.n}`).join(' · ')}</div>`}
  </div>
  <div class="card">
    <span class="label">Nombre de preguntes</span>
    <div class="row">${ns.map(n=>`<button class="chip${S.numQ===n?' ab':''}" data-a="numq" data-v="${n}">${n}</button>`).join('')}</div>
  </div>
  <button class="btn-start" ${ok?'':'disabled'} data-a="start">${ok?'Iniciar Examen →':'Selecciona un tema per continuar'}</button>
  <p style="text-align:center;font-size:11px;color:#334155;margin-top:14px">📱 iOS: Compartir → Afegir a pantalla d'inici &nbsp;|&nbsp; Android: ⋮ → Afegir a pantalla d'inici</p>
  </div>`;
}

function rQuiz(){
  const q=S.qList[S.cur];const pct=S.cur/S.qList.length*100;const ti=TI[q.t]||{};
  const opts=q.o.map((op,i)=>{
    let cls='opt',ic='';
    if(S.exp){if(i===q.c){cls+=' ok';ic='<span style="flex-shrink:0;font-weight:700;margin-right:2px">✓</span>';}else if(i===S.sel){cls+=' ko';ic='<span style="flex-shrink:0;font-weight:700;margin-right:2px">✗</span>';}else cls+=' fd';}
    return`<button class="${cls}" data-a="opt" data-v="${i}" ${S.exp?'disabled':''}>${ic}<span>${op}</span></button>`;
  }).join('');
  return`<div style="padding-top:12px">
  <div class="hdr">
    <button style="background:none;border:none;color:#475569;cursor:pointer;font-size:13px" data-a="home">← Sortir</button>
    <span style="font-size:13px;font-weight:600;color:#94a3b8">${S.cur+1} / ${S.qList.length}</span>
    <span style="font-size:13px;font-weight:700;color:#22c55e">✓ ${S.score}</span>
  </div>
  <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
  <div class="badge">${ti.e||''} ${ti.n||'T'+q.t} — ${ti.d||''}</div>
  <div class="card">
    <p class="qtxt">${q.p}</p>
    <div>${opts}</div>
    ${S.exp?`<div class="exp">${q.e}</div>`:''}
    ${S.exp?`<button class="btn-next" data-a="next">${S.cur+1>=S.qList.length?'Veure resultat →':'Pròxima pregunta →'}</button>`:''}
  </div></div>`;
}

function rResult(){
  const pct=Math.round(S.score/S.qList.length*100);
  const errs=S.hist.filter(h=>!h.ok);
  let col='#ef4444',bg='rgba(239,68,68,.08)',bo='rgba(239,68,68,.25)',lbl='A reforçar',med='📚';
  if(pct>=80){col='#22c55e';bg='rgba(34,197,94,.08)';bo='rgba(34,197,94,.25)';lbl='Excel·lent';med='🏆';}
  else if(pct>=60){col='#f59e0b';bg='rgba(245,158,11,.08)';bo='rgba(245,158,11,.25)';lbl='Bé';med='👍';}
  const tids=[...new Set(S.hist.map(h=>h.t))];
  const bkd=tids.map(tid=>{const tot=S.hist.filter(h=>h.t===tid).length;const cor=S.hist.filter(h=>h.t===tid&&h.ok).length;const t=TI[tid]||{};return`<p style="font-size:13px;color:#64748b;padding:2px 0">${t.e||''} ${t.n||'T'+tid}: ${cor}/${tot}</p>`;}).join('');
  const ehtml=errs.map(e=>`<div class="err-item"><p class="err-q">${e.p}</p><p class="err-ko">✗ La teva: ${e.o[e.sel]}</p><p class="err-ok">✓ Correcta: ${e.o[e.c]}</p><p class="err-ex">${e.e}</p></div>`).join('');
  return`<div style="padding-top:12px">
  <div class="sc-card" style="background:${bg};border:1.5px solid ${bo}">
    <div style="font-size:40px;margin-bottom:10px">${med}</div>
    <div style="font-size:52px;font-weight:800;color:${col};line-height:1;margin-bottom:6px">${S.score}/${S.qList.length}</div>
    <div style="font-size:22px;font-weight:600;color:${col};margin-bottom:6px">${pct}%</div>
    <div style="font-size:14px;font-weight:500;color:${col};margin-bottom:10px">${lbl}</div>
    ${bkd}
  </div>
  ${errs.length===0?`<div class="card" style="text-align:center;border-color:rgba(34,197,94,.3)"><p style="color:#86efac;font-weight:600">✓ Cap error. Perfecte!</p></div>`:`<div class="card"><p style="color:#f87171;font-weight:700;font-size:14px;margin-bottom:16px">✗ Errors (${errs.length})</p>${ehtml}</div>`}
  <div class="row"><button class="btn-pri" data-a="repeat">Repetir</button><button class="btn-sec" data-a="home">Canviar</button></div>
  </div>`;
}

function bind(){
  document.querySelectorAll('[data-a]').forEach(el=>{
    el.addEventListener('click',()=>{
      const a=el.dataset.a,v=el.dataset.v;
      if(a==='mode'){S.mode=v;S.tema=null;render();}
      else if(a==='tema'){S.tema=parseInt(v);render();}
      else if(a==='numq'){S.numQ=parseInt(v);render();}
      else if(a==='start'){S.qList=getQ();S.cur=0;S.score=0;S.hist=[];S.sel=null;S.exp=false;S.screen='quiz';render();}
      else if(a==='opt'){
        if(S.sel!==null)return;
        const i=parseInt(v);S.sel=i;S.exp=true;
        const q=S.qList[S.cur];const ok=i===q.c;
        if(ok)S.score++;
        S.hist.push({...q,sel:i,ok});
        render();
      }
      else if(a==='next'){
        if(S.cur+1>=S.qList.length){S.screen='result';}
        else{S.cur++;S.sel=null;S.exp=false;}
        render();
      }
      else if(a==='repeat'){S.qList=getQ();S.cur=0;S.score=0;S.hist=[];S.sel=null;S.exp=false;S.screen='quiz';render();}
      else if(a==='home'){S.screen='home';render();}
    });
  });
}

render();
</script>
</body>
</html>
