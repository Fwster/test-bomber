<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:18px;margin-bottom:12px}
.label{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#64748b;margin-bottom:10px;display:block}
.row{display:flex;gap:8px}
.chip{flex:1;text-align:center;padding:9px 4px;border-radius:8px;border:1.5px solid #334155;font-size:13px;font-weight:500;color:#64748b;cursor:pointer;background:transparent;font-family:inherit;transition:all .15s}
.chip.ab{border-color:#6366f1;background:rgba(99,102,241,.1);color:#818cf8}
.theme-btn{width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid #334155;background:transparent;color:#e2e8f0;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;gap:10px;font-family:inherit;transition:all .15s}
.theme-btn.sel{border-color:#ef4444;background:rgba(239,68,68,.08);color:#f87171}
.theme-btn .sub{font-size:12px;color:#64748b;font-weight:400}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pbar{background:#1e293b;border-radius:4px;height:4px;margin-bottom:18px;overflow:hidden}
.pfill{background:#ef4444;height:4px;border-radius:4px;transition:width .4s ease}
.badge{display:inline-block;background:rgba(239,68,68,.12);color:#f87171;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid rgba(239,68,68,.2);margin-bottom:14px}
.qtxt{font-size:16px;font-weight:500;color:#e2e8f0;line-height:1.65;margin-bottom:20px}
.opt{width:100%;text-align:left;padding:12px 15px;border-radius:10px;border:1.5px solid #334155;background:transparent;color:#cbd5e1;font-size:14px;line-height:1.5;cursor:pointer;margin-bottom:9px;display:flex;align-items:flex-start;gap:10px;font-family:inherit;transition:all .15s}
.opt.ok{border-color:#22c55e;background:rgba(34,197,94,.08);color:#86efac}
.opt.ko{border-color:#ef4444;background:rgba(239,68,68,.08);color:#fca5a5}
.opt.fd{color:#475569}
.exp{background:rgba(99,102,241,.08);border-left:3px solid #6366f1;border-radius:10px;padding:14px;font-size:13px;color:#a5b4fc;line-height:1.65;margin-top:16px}
.btn-next{width:100%;padding:13px;background:#ef4444;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;margin-top:16px;font-family:inherit}
.sc-card{text-align:center;border-radius:16px;padding:32px 20px;margin-bottom:12px}
.mode-tog{display:flex;background:#0f172a;border-radius:10px;padding:4px;gap:4px;margin-bottom:12px}
.mode-btn{flex:1;padding:9px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:#64748b;transition:all .2s}
.mode-btn.act{background:#ef4444;color:white}
.err-item{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #0f172a}
.err-q{font-size:14px;color:#e2e8f0;font-weight:500;line-height:1.5;margin-bottom:8px}
.err-ko{font-size:12px;color:#fca5a5;margin-bottom:4px}
.err-ok{font-size:12px;color:#86efac;margin-bottom:8px}
.err-ex{font-size:12px;color:#94a3b8;background:#0f172a;padding:10px 12px;border-radius:8px;line-height:1.6}
.btn-sec{flex:1;padding:13px;background:transparent;color:#94a3b8;border:1.5px solid #334155;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px;font-family:inherit}
.btn-pri{flex:1;padding:13px;background:#ef4444;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
.btn-start{width:100%;padding:14px;background:#ef4444;color:white;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-start:disabled{background:#1e293b;color:#475569;border:1px solid #334155;cursor:not-allowed}
</style>

<script>
const TI={1:{n:'Tema 1',d:'Constitució Espanyola 1978',e:'⚖️'},2:{n:'Tema 2',d:'Estatut Autonomia IB',e:'🏝️'},3:{n:'Tema 3',d:'Règim Local',e:'🏛️'},9:{n:'Tema 9',d:'La Combustió',e:'🔥'},10:{n:'Tema 10',d:'Agents Extintors',e:'🧯'},12:{n:'Tema 12',d:'Intervencions NRBQ',e:'☢️'}};

const Q=[
// TEMA 1
{t:1,p:"L'art. 10.2 CE estableix que els drets fonamentals s'interpretaran de conformitat amb:",o:["A) La Declaració Universal dels Drets Humans i els Tractats internacionals ratificats per Espanya","B) La Carta dels Drets Fonamentals de la UE i els Tractats europeus","C) La jurisprudència del Tribunal Europeu de Drets Humans i el Conveni de Roma","D) La DUDH, la CEDH i la Carta de Drets Fonamentals de la UE conjuntament"],c:0,e:"L'art. 10.2 CE fa referència ÚNICAMENT a la DUDH i els Tractats internacionals ratificats per Espanya. La Carta UE i la CEDH no s'esmenten en aquest article."},
{t:1,p:"Quants capítols té el Títol I de la Constitució Espanyola i quins articles comprèn?",o:["A) 4 capítols, arts. 10 a 53","B) 6 capítols, arts. 10 a 56","C) 5 capítols, arts. 10 a 55","D) 5 capítols, arts. 11 a 55"],c:2,e:"El Títol I té 5 capítols i comprèn els arts. 10 a 55. El Cap.5 (art. 55) tanca el Títol amb la suspensió de drets."},
{t:1,p:"Quan s'assoleix la majoria d'edat, segons l'art. 12 CE?",o:["A) Als 16 anys","B) Als 21 anys","C) Als 20 anys","D) Als 18 anys"],c:3,e:"L'art. 12 CE és taxatiu: la majoria d'edat s'assoleix als 18 anys, sense cap excepció constitucional."},
{t:1,p:"L'art. 16 CE garanteix la llibertat ideològica, religiosa i de culte. Quina és la seva ÚNICA limitació expressament prevista per a les seves manifestacions?",o:["A) La protecció de la moral pública i de l'ordre social","B) El respecte als drets dels altres i a l'ordre públic","C) Les que estableixi una llei orgànica aprovada per les Corts","D) La necessària per al manteniment de l'ordre públic protegit per la Llei"],c:3,e:"L'art. 16.1 CE estableix com a única limitació 'la necessària per al manteniment de l'ordre públic protegit per la Llei'. No hi ha referència a la moral pública ni als drets dels altres."},
{t:1,p:"Quina és la durada màxima de la detenció preventiva sense posar el detingut a disposició judicial, segons l'art. 17.2 CE?",o:["A) 24 hores","B) 48 hores","C) 72 hores","D) 96 hores"],c:2,e:"L'art. 17.2 CE fixa el termini màxim en 72 hores, passat el qual s'ha de posar el detingut en llibertat o a disposició de l'autoritat judicial."},
{t:1,p:"En cas d'estat d'excepció, quin apartat de l'art. 17 CE NO pot ser suspès en cap cas?",o:["A) L'apartat 1: dret a la llibertat i la seguretat","B) L'apartat 2: durada màxima de la detenció","C) L'apartat 3: dret a ser informat dels drets i de les raons de la detenció","D) L'apartat 4: procediment d'habeas corpus"],c:2,e:"L'art. 55.1 CE estableix una excepció expressa: en estat d'excepció no es pot suspendre l'art. 17.3 (dret del detingut a ser informat). En estat de setge sí es pot suspendre."},
{t:1,p:"Quan pot entrar-se en un domicili sense consentiment del titular ni resolució judicial, segons l'art. 18.2 CE?",o:["A) En cas de delicte flagrant","B) Per raons de seguretat pública apreciades per l'autoritat policial","C) Quan hi hagi ordre del Ministeri Fiscal en una investigació penal urgent","D) En cas d'estat d'alarma declarat pel Govern"],c:0,e:"L'art. 18.2 CE estableix que el domicili és inviolable amb única excepció: el delicte flagrant. Cap altra circumstància autoritza l'entrada sense resolució judicial ni consentiment."},
{t:1,p:"L'art. 19 CE estableix que el dret a sortir d'Espanya no pot ser limitat per motius:",o:["A) Econòmics o tributaris","B) De seguretat nacional o ordre públic","C) Penals, per resolució judicial motivada","D) Polítics o ideològics"],c:3,e:"L'art. 19 estableix expressament que el dret a entrar i sortir d'Espanya 'no podrà ser limitado por motivos políticos o ideológicos'."},
{t:1,p:"Les reunions en llocs de trànsit públic i les manifestacions requereixen, segons l'art. 21 CE:",o:["A) Autorització prèvia de l'autoritat governativa","B) Comunicació prèvia a l'autoritat","C) Resolució judicial habilitant","D) Autorització del Ministeri de l'Interior"],c:1,e:"L'art. 21.2 CE exigeix únicament comunicació prèvia a l'autoritat, no autorització. L'autoritat pot prohibir-les per raons fonamentades d'ordre públic, però no té poder general d'autoritzar."},
{t:1,p:"Quines associacions es consideren il·legals, segons l'art. 22 CE?",o:["A) Les que persegueixin fins o usin mitjans constitutius de delicte, les secretes i les paramilitars","B) Únicament les que promoguin la violència política","C) Les que no estiguin inscrites al Registre Nacional d'Associacions","D) Les que tinguin finançament estranger sense autorització"],c:0,e:"L'art. 22.2 CE declara il·legals les associacions que persegueixin fins o usin mitjans tipificats com a delicte, les secretes i les de caràcter paramilitar."},
{t:1,p:"L'art. 24 CE reconeix el dret a la tutela judicial efectiva. Quina garantia essencial hi afegeix el text constitucional?",o:["A) El dret a un procés de durada raonable, no superior a sis mesos","B) L'accés gratuït a la justícia per a tothom","C) Que en cap cas pugui produir-se indefensió","D) La presència obligatòria d'advocat en tot procediment"],c:2,e:"L'art. 24.1 CE afegeix expressament que 'en ningún caso podrá producirse indefensión'. Aquesta garantia és el complement essencial del dret a la tutela judicial."},
{t:1,p:"El Defensor del Poble, segons l'art. 54 CE, és:",o:["A) Un òrgan del Govern designat pel Consell de Ministres","B) L'alt comissionat de les Corts Generals, regulat per llei orgànica, per a la defensa dels drets del Títol I","C) Un òrgan del TC, regulat per llei ordinària","D) Un organisme europeu en representació del Parlament Europeu"],c:1,e:"L'art. 54 CE: el Defensor del Poble és l'alt comissionat de les Corts Generals, designat per elles, regulat per llei orgànica, per a la defensa dels drets del Títol I."},
{t:1,p:"L'art. 55.2 CE permet la suspensió INDIVIDUAL de certs drets. En quines circumstàncies i amb quines garanties?",o:["A) En estat d'excepció, sense necessitat d'intervenció judicial","B) Per ordre ministerial, en investigacions de crim organitzat, amb control parlamentari","C) Per llei orgànica, en relació amb bandes armades o terrorisme, amb intervenció judicial i control parlamentari","D) Per resolució del Congrés, en casos de risc per a la seguretat nacional"],c:2,e:"L'art. 55.2 CE permet que una LO determini la suspensió individual dels arts. 17.2 i 18.2 i 3, exclusivament en relació amb bandes armades o terrorisme, i sempre amb intervenció judicial i control parlamentari."},
{t:1,p:"El mecanisme de tutela de l'art. 53.2 CE per als drets de l'art. 14 i la Secció 1a del Cap. 2 inclou:",o:["A) Únicament el recurs d'empara davant el Tribunal Constitucional","B) Únicament el procediment preferent i sumari davant tribunals ordinaris","C) Procediment preferent i sumari davant tribunals ordinaris i, si s'escau, recurs d'empara davant el TC","D) La tutela directa davant el Tribunal Suprem per via preferent"],c:2,e:"L'art. 53.2 CE estableix un doble mecanisme: procediment preferent i sumari davant tribunals ordinaris + recurs d'empara davant el TC."},
{t:1,p:"L'art. 25.1 CE estableix el principi de legalitat penal. A més de prohibir condemnar per actes no tipificats, quina altra garantia recull?",o:["A) Que cap acusat pugui ser jutjat dues vegades pels mateixos fets","B) Que la instrucció penal no pugui durar més de dos anys","C) Que la pena imposada no pugui ser més greu que la que era aplicable en el moment de l'acció","D) Que tota pena sigui susceptible de revisió a petició del condemnat"],c:2,e:"L'art. 25.1 CE recull dos principis: no condemnar per actes no tipificats EN EL MOMENT de cometre's, i no imposar pena MÉS GREU que la aplicable aleshores."},
// TEMA 2
{t:2,p:"Quin qualificatiu atribueix l'art. 1 de l'EAIB a les Illes Balears?",o:["A) Nació insular amb dret a l'autodeterminació","B) Comunitat Autònoma de règim especial per insularitat","C) Comunitat Autònoma d'especial protecció mediambiental","D) Nacionalitat històrica"],c:3,e:"L'art. 1 EAIB defineix les Illes Balears com una 'nacionalitat històrica' i la seva denominació és 'Illes Balears'."},
{t:2,p:"Quin territori forma la CA de les Illes Balears, segons l'art. 2 de l'EAIB?",o:["A) Mallorca, Menorca, Eivissa i Formentera únicament","B) Mallorca, Menorca, Eivissa, Formentera, Cabrera i les altres illes menors adjacents","C) Mallorca, Menorca, Eivissa, Formentera, Cabrera i Dragonera","D) Les quatre illes majors i totes les illes del Mediterrani Occidental"],c:1,e:"L'art. 2 EAIB: Mallorca, Menorca, Eivissa, Formentera, CABRERA i les altres illes menors adjacents. Cabrera sí s'inclou tot i ser Parc Nacional."},
{t:2,p:"Quin règim de cooficialitat estableix l'art. 4 de l'EAIB per a la llengua catalana?",o:["A) La llengua catalana és oficial i la castellana s'admet com a llengua subsidiària","B) La llengua catalana, pròpia de les IB, tindrà juntament amb la castellana el caràcter d'idioma oficial","C) La llengua catalana té preferència en l'Administració autonòmica","D) Les dues llengües són cooficials però l'ús del català és obligatori en tots els actes oficials"],c:1,e:"L'art. 4 EAIB: cooficialitat plena entre català i castellà, sense preferència. Ningú pot ser discriminat per raó d'idioma."},
{t:2,p:"Quin és el Dia de les Illes Balears, segons l'art. 6 de l'EAIB?",o:["A) El 12 de setembre","B) El 9 d'octubre","C) L'1 de març","D) El 23 d'abril"],c:2,e:"L'art. 6 EAIB estableix que el Dia de les Illes Balears és l'1 de març."},
{t:2,p:"La bandera de les Illes Balears, descrita a l'art. 6 EAIB, presenta:",o:["A) Quatre barres grogues sobre fons roig, amb quartell blau i un arc d'argent","B) Quatre barres roges sobre fons groc, quartell morat superior esquerre amb castell blanc de cinc torres","C) Quatre barres roges sobre fons groc, quartell morat superior dret amb castell daurat de quatre torres","D) Tres barres blaves sobre fons blanc, amb quartell roig i lleó rampant"],c:1,e:"Bandera IB: 4 barres roges sobre fons groc, quartell a la part superior ESQUERRA de fons MORAT amb un castell BLANC de CINC torres."},
{t:2,p:"L'art. 7 EAIB estableix que la seu permanent del Parlament i del Govern és a Palma. Quina matisació important afegeix?",o:["A) Que és definitiva i no pot ser traslladada","B) Que el Govern pot traslladar la seu per acord del Consell de Govern","C) Que el Parlament i el Govern poden reunir-se en altres llocs de les IB d'acord amb el Reglament del Parlament i la llei","D) Que Palma és la seu administrativa però no la política"],c:2,e:"L'art. 7 EAIB: 'sense perjudici que el Parlament i el Govern puguin reunir-se en altres llocs de les IB, d'acord amb el Reglament del Parlament i la llei'."},
{t:2,p:"Quin model d'organització territorial adopten les Illes Balears, segons l'art. 8 EAIB?",o:["A) En municipis i comarques","B) En províncies i municipis","C) En illes, comarques i municipis","D) En illes i municipis"],c:3,e:"L'art. 8 EAIB organitza el territori en ILLES i MUNICIPIS. No s'esmenten ni comarques ni províncies."},
{t:2,p:"Quin requisit bàsic exigeix l'art. 9 EAIB per tenir la condició política de ciutadà de les IB?",o:["A) Tenir veïnatge administratiu en qualsevol dels municipis de les IB","B) Haver nascut a les IB o tenir ascendents de primer grau insulars","C) Tenir residència efectiva a les IB durant un mínim de 5 anys","D) Ser espanyol i tenir el domicili fiscal a qualsevol municipi de les IB"],c:0,e:"L'art. 9 EAIB estableix que la condició política s'adquireix pel VEÏNATGE ADMINISTRATIU en qualsevol municipi de les IB. El criteri de naixement no existeix en aquest article."},
{t:2,p:"Quina condició imposa l'art. 11 EAIB a les comunitats balears de l'exterior que obtenen el reconeixement de la seva personalitat d'origen?",o:["A) Que contribueixin econòmicament a les institucions autonòmiques","B) Que no puguin exercir cap dret polític","C) Que s'inscriguin al registre oficial de comunitats balears a l'exterior","D) Que promoguin la llengua catalana entre els seus membres"],c:1,e:"L'art. 11 EAIB: el reconeixement de la personalitat d'origen a les comunitats balears de l'exterior 'en cap cas implica la concessió de drets polítics'."},
{t:2,p:"Per quin procediment s'aprova un Estatut d'Autonomia i quina majoria es requereix?",o:["A) Llei ordinària de les Corts Generals, per majoria simple","B) Llei orgànica, que requereix majoria de dos terços del Congrés i del Senat","C) Llei orgànica, que requereix majoria absoluta del Congrés en votació final sobre el conjunt del projecte","D) Decret legislatiu del Govern, ratificat per les Corts Generals"],c:2,e:"Els Estatuts d'Autonomia s'aproven per Llei Orgànica (art. 81 CE), que requereix majoria ABSOLUTA del Congrés en votació final. La majoria de dos terços correspon a la reforma constitucional."},
{t:2,p:"L'art. 3 EAIB reconeix la insularitat com:",o:["A) Un obstacle per al desenvolupament econòmic","B) Una característica geogràfica sense implicacions jurídiques específiques","C) Un fet diferencial que mereix protecció especial, havent els poders públics d'evitar desequilibris econòmics derivats d'ella","D) Un avantatge fiscal reconegut per la CE"],c:2,e:"L'art. 3 EAIB reconeix la insularitat com un fet diferencial mereixedor de protecció especial, i obliga els poders públics a evitar desequilibris econòmics derivats d'ella."},
{t:2,p:"Quina estructura bàsica té l'EAIB quant a Títols i disposicions?",o:["A) 7 Títols, 4 disposicions addicionals i 8 transitòries","B) 9 Títols, 6 disposicions addicionals i 11 disposicions transitòries","C) 10 Títols, 5 disposicions addicionals i 9 transitòries","D) 8 Títols, 6 disposicions addicionals i 12 transitòries"],c:1,e:"L'EAIB s'estructura en 9 Títols, 6 disposicions addicionals, 11 disposicions transitòries i 1 disposició final."},
{t:2,p:"Els espanyols residents a l'estranger que volen tenir la condició política de ciutadans de les IB han de complir:",o:["A) Haver nascut a les IB i mantenir vincles familiars actius","B) Ser descendants de primera generació de mallorquins i estar inscrits al registre consular","C) Tenir o haver tingut el darrer veïnatge administratiu a les IB i acreditar-ho al consolat d'Espanya","D) Tenir 5 anys de residència prèvia a les IB i disposar de propietat immoble"],c:2,e:"L'art. 9 EAIB per a residents a l'estranger: 1) haver tingut el darrer veïnatge administratiu a les IB, 2) acreditar-ho al consolat d'Espanya corresponent."},
{t:2,p:"L'art. 147.2 CE estableix el contingut mínim obligatori dels Estatuts. Quin d'aquests elements NO hi figura?",o:["A) La denominació de la Comunitat","B) La delimitació del territori","C) El règim fiscal i financer especial de la CA","D) L'organització i seu de les institucions pròpies"],c:2,e:"L'art. 147.2 CE estableix quatre continguts mínims: denominació, territori, organització i seu de les institucions, i competències assumides. El règim fiscal no és un contingut obligatori d'aquest article."},
{t:2,p:"L'art. 12 EAIB recull els principis rectors de l'activitat pública. Quin instrument internacional s'incorpora explícitament?",o:["A) El Conveni Europeu de Drets Humans i la Carta Social Europea","B) La Carta dels Drets Fonamentals de la UE i el Conveni Europeu de Drets Humans","C) Únicament la Declaració Universal dels Drets Humans de l'ONU","D) El Tractat de Lisboa i la Carta Àrab dels Drets Humans"],c:1,e:"L'art. 12 EAIB fa referència expressa a la Carta dels Drets Fonamentals de la UE i al Conveni Europeu de Drets Humans (CEDH), a més dels drets fonamentals de la CE."},
// TEMA 3
{t:3,p:"Quins ens territorials enumera l'art. 137 CE com a divisions de l'organització de l'Estat?",o:["A) Municipis, Comarques i Comunitats Autònomes","B) Municipis, Províncies, Illes i Comunitats Autònomes","C) Municipis, Províncies i Comunitats Autònomes","D) Municipis, Províncies, Mancomunitats i Comunitats Autònomes"],c:2,e:"L'art. 137 CE esmenta tres ens: Municipis, Províncies i Comunitats Autònomes. Les Illes apareixen a l'art. 141.4 CE però no al 137."},
{t:3,p:"Com s'elegeixen els regidors dels ajuntaments, segons l'art. 140 CE?",o:["A) Per sufragi universal, igual, lliure, directe i secret","B) Per sufragi universal, igual i lliure, però indirecte a través de juntes de districte","C) Pel Parlament Autonòmic, a proposta de les organitzacions polítiques","D) Per designació del Govern de la CA"],c:0,e:"L'art. 140 CE: els regidors s'elegeixen per sufragi universal, igual, lliure, DIRECTE i secret. La CE preveu dues possibilitats per als alcaldes (regidors o veïns), però no per als regidors."},
{t:3,p:"Quin instrument normatiu es requereix per alterar els límits provincials, segons l'art. 141 CE?",o:["A) Reial Decret aprovat pel Consell de Ministres","B) Resolució del Senat per majoria absoluta","C) Llei ordinària de les Corts Generals","D) Llei orgànica de les Corts Generals"],c:3,e:"L'art. 141.1 CE exigeix llei orgànica de les Corts Generals per a qualsevol alteració dels límits provincials. Llei orgànica, no ordinària."},
{t:3,p:"Segons l'art. 141.4 CE, en els arxipèlags les illes tindran la seva administració pròpia en forma de:",o:["A) Cabildos o Consells","B) Diputacions Insulars","C) Mancomunitats Insulars","D) Consells Regionals Insulars"],c:0,e:"L'art. 141.4 CE: en els arxipèlags les illes tindran administració pròpia en forma de Cabildos o Consells. A Balears, la forma adoptada és Consell Insular."},
{t:3,p:"De quins recursos es nodreixen les Hisendes Locals, segons l'art. 142 CE?",o:["A) Exclusivament de tributs propis, sense participació en tributs d'altres administracions","B) De transferències de l'Estat i subvencions europees","C) De tributs propis i de la participació en els tributs de l'Estat i de les CCAA","D) De la participació exclusiva en els tributs de l'Estat"],c:2,e:"L'art. 142 CE: dues fonts fonamentals: tributs PROPIS + participació en els tributs de l'ESTAT i de les CCAA. Les dues fonts, no una sola."},
{t:3,p:"Quina és la data exacta de la Llei Reguladora de les Bases del Règim Local (LBRL)?",o:["A) Llei 7/1984, de 2 d'abril","B) Llei 7/1985, de 2 d'abril","C) Llei 7/1985, de 2 de maig","D) Llei 7/1986, de 28 de novembre"],c:1,e:"La LBRL és la Llei 7/1985, de 2 d'abril. No confondre amb el ROF (RD 2568/1986, de 28 de novembre)."},
{t:3,p:"El Reglament d'Organització, Funcionament i Règim Jurídic de les Entitats Locals (ROF) és:",o:["A) El Reial Decret 2568/1985, de 2 d'abril","B) El Reial Decret 896/1991, de 7 de juny","C) El Reial Decret 2568/1986, de 28 de novembre","D) La Llei 2568/1986, de 28 de novembre"],c:2,e:"El ROF és el RD 2568/1986, de 28 de novembre. El RD 896/1991 és de selecció de funcionaris locals. El 28 de novembre 1986 és el ROF."},
{t:3,p:"Quines entitats locals es consideren 'territorials' per l'art. 3 LBRL?",o:["A) El Municipi, la Província, les Illes en arxipèlags i les Àrees Metropolitanes","B) Únicament el Municipi i la Província","C) El Municipi, la Província i les Illes en els arxipèlags Balear i Canari","D) El Municipi, la Comarca i la Província"],c:2,e:"Entitats locals territorials (art. 3 LBRL): Municipi, Província i Illa (en arxipèlags Balear i Canari). Àrees metropolitanes, Comarques i Mancomunitats son 'altres entitats locals', no territorials."},
{t:3,p:"Quina potestat expressament NO té reconeguda una entitat local, tot i que sí té potestat reglamentària?",o:["A) La potestat expropiatòria","B) La potestat sancionadora","C) La potestat legislativa","D) La potestat tributària"],c:2,e:"Les entitats locals NO tenen potestat legislativa (art. 4 LBRL). Sí que tenen potestat reglamentària (ordenances), tributària, expropiatòria, sancionadora, etc."},
{t:3,p:"Segons l'art. 1.1 LBRL, el Municipi és:",o:["A) L'ens local determinat per l'agrupació de parròquies i entitats menors","B) L'entitat bàsica de l'organització territorial de l'Estat i canal immediat de participació ciutadana en els assumptes públics","C) L'entitat pública menor que gestiona els serveis locals sota la tutela de la Diputació","D) L'administració local de primer nivell creada per la CA per a la gestió descentralitzada"],c:1,e:"Art. 1.1 LBRL: 'l'entitat bàsica de l'organització territorial de l'Estat i canal immediat de participació ciutadana en els assumptes públics, que institucionalitza i gestiona amb autonomia els interessos propis de la col·lectivitat'."},
{t:3,p:"L'art. 139 CE prohibeix mesures que obstaculitzin. Quins dos drets protegeix explícitament?",o:["A) La llibertat de circulació de persones i el dret a la propietat privada","B) La llibertat d'empresa i el dret de residència en qualsevol CA","C) Únicament la lliure circulació de béns entre CCAA","D) La llibertat de circulació i establiment de les persones i la lliure circulació de béns en tot el territori"],c:3,e:"L'art. 139.2 CE protegeix dos drets: llibertat de circulació I establiment de les persones + lliure circulació de béns. Ambdós, no un sol."},
{t:3,p:"L'autonomia local garantida constitucionalment és de quina naturalesa?",o:["A) Administrativa, no política ni sobirana, dins del marc legal de l'Estat i les CCAA","B) Política, equivalent a la de les CCAA però d'àmbit menor","C) Sobirana, ja que les entitats locals representen directament la voluntat popular","D) Administrativa i plena, sense possibilitat d'intervenció estatal ni autonòmica"],c:0,e:"L'autonomia local és de naturalesa ADMINISTRATIVA, no política ni sobirana. Opera dins del marc legal establert per l'Estat i les CCAA. No és absoluta."},
{t:3,p:"La distinció estructural entre l'Administració Local i l'Administració Perifèrica de l'Estat és:",o:["A) La Local depèn de les CCAA i la Perifèrica depèn de l'Estat","B) La Local té potestat sancionadora i la Perifèrica no","C) La Local és integrada per ents amb personalitat jurídica pròpia; la Perifèrica, per òrgans sense personalitat jurídica independent","D) La Local gestiona serveis socials i la Perifèrica gestiona seguretat"],c:2,e:"Diferència fonamental: Administració Local = ENTS (personalitat jurídica pròpia) vs Administració Perifèrica = ÒRGANS (sense personalitat jurídica independent)."},
{t:3,p:"Les Mancomunitats de Municipis, les Àrees Metropolitanes i les Comarques a la LBRL es classifiquen com:",o:["A) Entitats locals territorials de segon nivell","B) Altres entitats locals, no territorials","C) Entitats locals supramunicipals amb rang de Província","D) Ens paralocals sense personalitat jurídica pròpia"],c:1,e:"La LBRL distingeix entitats locals territorials (Municipi, Província, Illa) d'ALTRES entitats locals, on s'inclouen Mancomunitats, Àrees Metropolitanes, Comarques i entitats d'àmbit inferior al municipi."},
{t:3,p:"Segons l'art. 4.2 LBRL, les potestats reconegudes als Municipis, Províncies i Illes:",o:["A) No poden ser delegades a cap altra entitat local","B) Únicament corresponen als ens territorials","C) Podran ser aplicades o reconegudes a les restants entitats locals","D) Podran ser exercides per les CCAA quan l'entitat local no les exerceixi"],c:2,e:"L'art. 4.2 LBRL: les potestats reconegudes als Municipis, Províncies i Illes 'podran ser aplicades o reconegudes a les restants entitats locals'."},
// TEMA 9
{t:9,p:"Quin és el quart element que s'afegeix als tres del triangle del foc per formar el tetraedre?",o:["A) La temperatura d'ignició","B) La reacció en cadena","C) La concentració del combustible","D) La velocitat de propagació de la flama"],c:1,e:"El triangle: combustible, comburent i calor. El quart element és la REACCIÓ EN CADENA, que explica l'autosostiment de la combustió i és la base dels agents d'inhibició."},
{t:9,p:"La classe de foc A correspon a:",o:["A) Sòlids que formen brases en la seva combustió, com fusta, paper i teixits naturals","B) Líquids inflamables i sòlids liquables, com benzina o parafina","C) Gasos inflamables, com propà, butà o hidrogen","D) Metalls combustibles, com magnesi o titani"],c:0,e:"Classe A = sòlids que formen brases (incandescència residual): fusta, paper, cartró, teixits naturals. Classe B = líquids; C = gasos; D = metalls; F/K = greixos de cuina."},
{t:9,p:"Per quin motiu NO s'ha d'usar mai aigua per apagar un foc de classe F/K (olis i greixos de cuina)?",o:["A) Perquè l'água no té capacitat de refredament sobre greixos","B) Perquè l'oli apaga l'água per acció química","C) Perquè l'água és miscible en l'oli i el dispersa sense apagar","D) Perquè l'oli es troba a temperatures superiors als 100°C i l'água es vaporitza instantàniament generant projeccions violentes d'oli en flames"],c:3,e:"L'oli en combustió supera sovint els 300°C. L'agua contacta i es vaporitza explosivament, generant projeccions violentes d'oli encès que agreugen la situació."},
{t:9,p:"El Límit Inferior d'Inflamabilitat (LII) és:",o:["A) La temperatura mínima a la qual un combustible emet vapors per cremar","B) La concentració màxima de vapor en l'aire per sobre de la qual no hi ha ignició","C) La concentració mínima de vapor o gas en l'aire per sota de la qual la barreja és massa pobra per cremar","D) La pressió mínima a la qual un gas pot mantenir la combustió"],c:2,e:"LII = concentració MÍNIMA de vapor/gas en l'aire per sota de la qual la mescla és massa pobra. LSI = concentració MÀXIMA. Entre LII i LSI: zona inflamable."},
{t:9,p:"El flashover en un incendi interior es defineix com:",o:["A) L'entrada sobtada d'oxigen en un espai confinat que provoca la ignició dels gasos acumulats","B) La ignició quasi simultània de tots els materials combustibles d'un compartiment per acumulació de calor radiant","C) La fase inicial de l'incendi en que el foc es propaga des del focus original","D) L'extinció sobtada d'un incendi per esgotament del combustible"],c:1,e:"Flashover = ignició quasi simultània de tots els gasos i materials d'un compartiment per acumulació de calor radiant (~500-600°C al sostre). El fenomen de l'entrada sobtada d'O2 és el backdraft."},
{t:9,p:"El backdraft es produeix quan:",o:["A) S'introdueix oxigen de forma sobtada en un incendi limitat per ventilació, provocant la ignició explosiva dels gasos acumulats","B) El combustible s'esgota i la flama s'extingeix per inanició","C) La temperatura supera el punt d'autoignició de tots els materials del recinte","D) El fum s'acumula al sostre i descendeix fins al nivell del sòl"],c:0,e:"Backdraft: un ILV té gasos combustibles acumulats sense prou O2 per cremar. En rebre O2 sobtadament (obrir porta), es produeix deflagració o explosió."},
{t:9,p:"Un incendi limitat per ventilació (ILV) es caracteritza per:",o:["A) Tenir poc combustible però abundant oxigen","B) Estar a l'exterior on el vent dificulta l'extinció","C) Requerir ventilació artificial per poder ser extingit","D) Tenir restricció en el desenvolupament per manca d'oxigen, tot i tenir combustible disponible"],c:3,e:"ILV: el factor limitant és la disponibilitat d'OXIGEN, no el combustible (que hi és en abundància). Risc: generació de CO per combustió incompleta i possibilitat de backdraft."},
{t:9,p:"Quines són les tres formes de transmissió de la calor?",o:["A) Irradiació, conductivitat i convecció","B) Fusió, evaporació i sublimació","C) Conducció, convecció i radiació","D) Conducció, convecció i propagació"],c:2,e:"Les tres formes: conducció (contacte entre sòlids), convecció (moviment de fluids: calent puja, fred baixa) i radiació (ones electromagnètiques). En incendis, la convecció és determinant en la propagació vertical."},
{t:9,p:"Quin tipus de combustible indica principalment un fum de color negre i dens?",o:["A) Matèria vegetal seca (llenya, palla, fenc)","B) Fibres sintètiques, polímers, cautxús i derivats del petroli","C) Metalls en combustió","D) Substàncies químiques amb sofre"],c:1,e:"Fum negre = combustió incompleta de fibres sintètiques, polímers, cautxús i derivats del petroli. Fum groc = sofre; groc verdós = clor; blanc/gris = materials naturals o humitat."},
{t:9,p:"El monòxid de carboni (CO) és especialment perillós perquè actua com a:",o:["A) Gas asfixiant químic que interfereix directament amb el transport d'oxigen a nivell cel·lular","B) Gas asfixiant simple que desplaça l'oxigen de l'ambient","C) Gas irritant corrosiu que danya les vies respiratòries per contacte","D) Gas explosiu que forma barreges inflamables en qualsevol concentració"],c:0,e:"CO = asfixiant químic: s'uneix a l'hemoglobina amb afinitat 200-250 vegades superior a l'O2, impedint el transport d'oxigen a les cèl·lules."},
{t:9,p:"La fase de decaïment d'un incendi interior s'inicia quan la concentració d'oxigen baixa per sota de:",o:["A) El 18%","B) El 20%","C) El 10%","D) El 15%"],c:3,e:"La fase de decaïment comença quan la concentració d'O2 baixa del 15%, llindar a partir del qual la combustió completa ja no és viable."},
{t:9,p:"La combustió incompleta es produeix quan hi ha dèficit d'oxigen i genera principalment:",o:["A) Diòxid de carboni (CO2) i vapor d'agua","B) Hidrogen i oxigen molecular","C) Monòxid de carboni (CO) i sutge","D) Nitrogen i ozó"],c:2,e:"Combustió incompleta (dèficit O2) → monòxid de carboni (CO) + sutge. Combustió completa → CO2 + H2O."},
{t:9,p:"Quin és el factor de major risc durant un incendi, per davant de la pròpia flama?",o:["A) La calor radiant","B) El fum","C) L'estructura en col·lapse","D) L'explosió de gasos confinats"],c:1,e:"El fum és el factor de major risc: irritació (mucoses, visió), obstacle visual i asfíxia (CO, HCN). La majoria de víctimes mortals en incendis moren per inhalació, no per cremades."},
{t:9,p:"La piròlisi és el procés pel qual:",o:["A) Els combustibles sòlids alliberen gasos o vapors combustibles quan se'ls aplica calor, sense necessitat d'oxigen","B) L'oxigen es combina directament amb el combustible sòlid per produir la flama","C) La calor es transmet per conducció entre materials sòlids en contacte","D) La temperatura d'un incendi augmenta exponencialment per acumulació de gasos"],c:0,e:"Piròlisi = descomposició tèrmica dels materials sòlids/líquids per efecte de la calor i en absència d'O2, alliberant gasos/vapors combustibles. El sòlid no crema directament; crema el gas que emet."},
{t:9,p:"Un incendi de grau I, segons la classificació per superfície afectada, correspon a:",o:["A) De 4 a 10 m²","B) De 10 a 100 m²","C) De 1.000 a 5.000 m²","D) Fins a 4 m²"],c:3,e:"Classificació per graus: Grau I (<4m²), II (4-10m²), III (10-100m²), IV en endavant = d'envergadura (de 100m² fins a >5.000 ha)."},
// TEMA 9 — preguntes addicionals dificultat alta
{t:9,p:"La combustió és una reacció química de tipus REDOX. En aquest context, el combustible actua com a:",o:["A) Agent oxidant, que cedeix electrons al comburent i es redueix","B) Catalitzador, que accelera la reacció sense consumir-se","C) Agent neutre, que únicament allibera energia tèrmica","D) Agent reductor, que cedeix electrons al comburent i s'oxida"],c:3,e:"En una combustió (reacció REDOX), el combustible S'OXIDA (és l'agent reductor, cedeix electrons) i el comburent es REDUEIX. La combustió és exotèrmica: ΔH < 0."},
{t:9,p:"La norma ISO 13943 defineix la piròlisi com:",o:["A) La combustió dels vapors generats en la superfície d'un sòlid en presència d'oxigen","B) La ignició espontània d'un material sense font d'ignició externa","C) La descomposició química irreversible d'una substància per efecte de la temperatura, en absència d'oxigen","D) L'oxidació lenta d'un material a temperatura inferior al punt d'inflamació"],c:2,e:"ISO 13943: piròlisi = descomposició química irreversible per efecte de la temperatura, en ABSÈNCIA d'oxigen. No és combustió pròpiament dita; és el procés previ i indispensable per als sòlids."},
{t:9,p:"Quina és la seqüència correcta del procés tèrmic que pateix un material sòlid durant un incendi?",o:["A) Piròlisi → Assecat → Combustió → Reducció","B) Assecat → Combustió → Piròlisi → Reducció","C) Combustió → Assecat → Piròlisi → Reducció","D) Assecat → Piròlisi → Combustió → Reducció"],c:3,e:"La seqüència correcta és: Assecat (eliminació d'humitat) → Piròlisi (descomposició tèrmica, endotèrmica) → Combustió (dels gasos alliberats) → Reducció (brases, CO₂, H₂O)."},
{t:9,p:"El punt d'inflamació i el punt de combustió d'una substància difereixen en que:",o:["A) El punt d'inflamació és sempre superior al de combustió","B) El punt de combustió és superior al d'inflamació i implica combustió sostinguda sense la font d'ignició","C) El punt d'inflamació implica combustió sostinguda, el de combustió és simplement ignició momentània","D) El punt de combustió és equivalent al punt d'autoignició"],c:1,e:"El punt d'inflamació: ignició momentània que s'apaga en retirar la font. El punt de COMBUSTIÓ: temperatura superior, en la qual la combustió es manté de forma sostinguda sense la font d'ignició."},
{t:9,p:"Quin gas inflamable NO té, en la pràctica, un Límit Superior d'Inflamabilitat (LSI) ben definit, perquè pot descompondre's explosivament fins i tot sense oxigen?",o:["A) Metà","B) Propà","C) Monòxid de carboni","D) Acetilè"],c:3,e:"L'ACETILÈ (C₂H₂) pot descompondre's explosivament fins i tot sense presència d'oxigen, per la inestabilitat del seu triple enllaç carboni-carboni. Per això no té LSI real definit i es manipula dissolt en acetona."},
{t:9,p:"Quin és el Límit Inferior d'Inflamabilitat (LII) del monòxid de carboni (CO), corregit respecte al document de l'acadèmia que tenia un error?",o:["A) 15,5% (valor incorrecte que apareixia en el document original)","B) 12,5% (valor tècnicament correcte)","C) 5%","D) 2,5%"],c:1,e:"El LII del CO és el 12,5% (rang 12,5%-74%). El document original de l'acadèmia tenia un error i posava 15,5%; el valor tècnicament correcte, corroborat per altres fonts i la pròpia fitxa del gas, és el 12,5%."},
{t:9,p:"Quin és el Límit Superior d'Inflamabilitat (LSI) del metà (CH₄)?",o:["A) 5%","B) 7,6%","C) 15%","D) 74%"],c:2,e:"El metà té LII = 5% i LSI = 15%. El 74% és el LSI del CO. El 7,6% és el LSI de la gasolina. Memoritza: metà 5-15%, gasolina 1,4-7,6%, CO 12,5-74%."},
{t:9,p:"Si la concentració d'oxigen en l'atmosfera augmenta al 24%, quin efecte té sobre la velocitat de combustió?",o:["A) L'augmenta un 50% respecte a les condicions normals","B) La dobla: el foc es desenvolupa el doble de ràpid que amb un 21% d'O₂","C) La triplica","D) La quadruplica"],c:1,e:"Amb un 24% d'O₂, el foc es desenvolupa EL DOBLE de ràpid que en condicions normals (21%). Amb un 40% d'O₂, la velocitat es quadruplica. Implicació crítica en entorns hospitalaris o de soldadura."},
{t:9,p:"Quin efecte té un augment de temperatura sobre els límits d'inflamabilitat d'una substància?",o:["A) El LII augmenta i el LSI disminueix, reduint el rang d'inflamabilitat","B) Tant el LII com el LSI augmenten proporcionalment sense modificar el rang","C) El LII disminueix (~8%) i el LSI augmenta (~8%), ampliant el rang d'inflamabilitat","D) Ni el LII ni el LSI canvien amb la temperatura"],c:2,e:"A major temperatura: LII baixa ~8% i LSI puja ~8%. El rang d'inflamabilitat S'AMPLIA, incrementant el risc. Un escenari amb calor preexistent (foc adjacent) fa que substàncies 'fora de rang' a temperatura ambient entrin a la zona perillosa."},
{t:9,p:"Quin efecte té un augment de pressió sobre els límits d'inflamabilitat?",o:["A) Eleva el LII i redueix el LSI, estrenyent el rang","B) Augmenta principalment el LSI, ampliant lleugerament el rang d'inflamabilitat per dalt","C) Redueix principalment el LII, ampliant el rang per baix de forma simètrica","D) No té cap efecte significatiu sobre els límits d'inflamabilitat"],c:1,e:"A major pressió → augmenta el LSI (rang s'eixampla per dalt). L'efecte sobre el LII és lleuger. A pressió inferior a ~5 kPa, la flama NO es propaga per manca de densitat molecular."},
{t:9,p:"A quin valor de pressió aproximat la flama NO es pot propagar, per manca de densitat molecular suficient?",o:["A) Per sota de 50 kPa","B) Per sota de 20 kPa","C) Per sota de 5 kPa","D) Per sota de 1 kPa"],c:2,e:"Per sota d'uns 5 kPa, la densitat molecular és insuficient per sostenir la reacció en cadena i la flama no es propaga. Rellevant en treballs a gran altitud o en condicions de buit parcial."},
{t:9,p:"El punt estequiomètric dins del rang d'inflamabilitat és:",o:["A) El punt on la combustió és mínima i més controlable","B) El punt on la mescla és massa rica per cremar, limitant la propagació","C) La proporció exacta combustible/comburent per a una oxidació completa, on la combustió és més intensa i explosiva","D) El llindar entre el LII i el LSI on la velocitat de propagació és màxima"],c:2,e:"El punt estequiomètric és la concentració exacta que preveu l'equació química equilibrada: combustió MÉS INTENSA i explosiva possible, reactius consumits totalment. No és el punt mig del rang: és la proporció química ideal."},
{t:9,p:"Durant la fase de creixement d'un incendi interior, quin mecanisme de transmissió de calor afecta principalment els materials a la PART SUPERIOR del recinte?",o:["A) La conducció, a través de les parets i el sostre","B) La radiació, que incideix sobre les superfícies horitzontals superiors","C) La convecció, que transporta energia tèrmica cap amunt a través del flux ascendent de gasos calents","D) La irradiació ultraviolada generada per la flama"],c:2,e:"La CONVECCIÓ és el mecanisme dominant que afecta la part superior: els gasos calents, menys densos, ascendeixen i acumulen calor al sostre. La radiació afecta els materials propers al focus; la conducció, les estructures sòlides."},
{t:9,p:"Quin fenomen visual observable al SOSTRE d'un recinte és indicador PREVI al flashover?",o:["A) Condensació de vapor d'agua al sostre (degoteig)","B) Rollover: flames intermitents que corren pel sostre, indicant que el colxó de gasos s'està encenent puntualment","C) Caiguda sobtada de la temperatura al sostre detectable amb termòmetre infraroig","D) Formació de sutge blanc al sostre"],c:1,e:"El ROLLOVER (o flamejament de cortina) és la senyal prèvia clau: flames intermitents que corren pel sostre, indicant que el colxó de gasos s'està encenent puntualment. Poc després pot produir-se el flashover generalitzat."},
{t:9,p:"Quina és la diferència fonamental entre la CAUSA del flashover i la del backdraft?",o:["A) El flashover és causat per entrada sobtada d'oxigen; el backdraft per acumulació de calor radiant","B) El flashover és causat per acumulació de calor fins al punt d'inflamabilitat dels gasos; el backdraft per entrada sobtada d'oxigen en un ILV","C) El flashover i el backdraft tenen la mateixa causa: saturació de gasos combustibles","D) El flashover es produeix en espais oberts; el backdraft en espais tancats"],c:1,e:"Flashover = acumulació de CALOR fins al punt d'inflamabilitat del colxó de gasos (ILC avançat). Backdraft = entrada sobtada d'OXIGEN en un ILV avançat. Causes diametralment oposades: calor vs. oxigen."},
{t:9,p:"En un incendi amb sospita d'ILV avançat (backdraft possible), quina tècnica permet refredar els gasos abans d'obrir accessos?",o:["A) Injecció de CO₂ a alta pressió per la part superior de la porta","B) Obertura ràpida de totes les finestres simultàniament per crear tiratge","C) Polvorització d'agua en petites ràfegues cap al sostre (pulsing o penciling) per refredar el colxó de gasos","D) Aplicació de pols ABC a través d'una escletxa per inhibir la reacció en cadena"],c:2,e:"La tècnica de PULSING o PENCILING consisteix en polvoritzar agua en petites ràfegues cap al sostre per refredar el colxó de gasos calents, reduint el risc de backdraft en obrir l'accés. Forma part dels protocols d'intervenció en ILV avançat."},
{t:9,p:"En un incendi interior, el PLA NEUTRE és:",o:["A) El punt on la temperatura del fum és igual a la temperatura exterior","B) La zona intermèdia entre l'estrat superior de gasos calents i l'estrat inferior d'aire net, on la pressió interior iguala la pressió exterior","C) L'alçada a partir de la qual l'extinció per agua és ineficaç","D) El nivell de sòl on s'acumulen els gasos asfixiants més densos"],c:1,e:"El PLA NEUTRE és la frontera entre els dos estrats (superior: gasos calents a pressió positiva; inferior: aire relativament net a pressió negativa). Per sota, l'aire exterior tendeix a entrar. Per sobre, els gasos calents surten. Referència operativa per a la progressió del personal."},
{t:9,p:"En un ILV avançat, la visibilitat i la concentració de CO presenten la combinació:",o:["A) Visibilitat alta; CO baix","B) Visibilitat alta; CO molt alt","C) Visibilitat reduïda o nul·la; CO molt alt","D) Visibilitat reduïda; CO baix per oxidació completa"],c:2,e:"ILV: combustió incompleta → CO molt alt. Fum dens → visibilitat nul·la. A diferència de l'ILC, en l'ILV la concentració de gasos tòxics és molt alta i l'operació sense EPR és letal."},
{t:9,p:"La classificació d'incendis per magnitud inclou: conat, parcial i total. Quina definició correspon a l'incendi TOTAL?",o:["A) Incendi de dimensions petites, sofocable amb extintors portàtils estàndard","B) Incendi que afecta una part de la instal·lació, potencialment perillós si no es conté","C) Incendi completament fora de control que afecta la totalitat d'una estructura; l'objectiu principal passa a ser la contenció","D) Incendi que supera els 100 m² però que pot ser extingit amb medis aeris"],c:2,e:"Incendi TOTAL: fora de control, afecta la totalitat de l'estructura. L'objectiu operatiu ja no és l'extinció immediata sinó la CONTENCIÓ per evitar propagació a edificis veïns."},
{t:9,p:"Un foc 'alimentat' es defineix com aquell en el qual:",o:["A) L'incendi es produeix sobre un pla horitzontal","B) El foc es manté actiu gràcies a un subministrament continu de combustible procedent de dipòsits no afectats (fuita de gas, canonada trencada)","C) El foc s'alimenta únicament de materials sòlids que formen brases","D) L'incendi ascendeix verticalment seguint la columna de convecció"],c:1,e:"Foc ALIMENTAT: l'incendi (pla o vertical) es manté per un subministrament CONTINU de combustible des de dipòsits encara no afectats. Exemples: fuita de gas amb combustió sostinguda, canonades trencades. Estratègia clau: tallar el subministrament."},
{t:9,p:"Quin gas tòxic, a més del CO, es genera especialment en la combustió de materials sintètics moderns i és letal en concentracions molt baixes?",o:["A) Diòxid de sofre (SO₂)","B) Amoníac (NH₃)","C) Cianur d'hidrogen (HCN)","D) Diòxid de nitrogen (NO₂)"],c:2,e:"El CIANUR D'HIDROGEN (HCN) es genera en la combustió de materials sintètics amb nitrogen (polièsters, niló, poliuretà, llana). És especialment letal en concentracions molt baixes i actua com a asfixiant químic, igual que el CO."},
{t:9,p:"Per quin motiu la fase de DECAÏMENT d'un incendi interior NO és necessàriament menys perillosa que les fases anteriors?",o:["A) Perquè la temperatura es dispara en aquesta fase, superant els valors del ple desenvolupament","B) Perquè la combustió incompleta típica del decaïment genera una atmosfera especialment carregada de CO i gasos tòxics, amb pràcticament nul·la visibilitat","C) Perquè la pressió interior baixa sobtadament i les estructures col·lapsen","D) Perquè el combustible que no ha cremat s'acumula i pot explotar en contacte amb l'agua d'extinció"],c:1,e:"En el decaïment, la temperatura baixa però la combustió incompleta (O₂ < 15%) genera concentracions molt altes de CO i gasos tòxics. La visibilitat pot ser nul·la. L'atmosfera és altament tòxica, no respirable sense EPR."},
{t:9,p:"La gasolina té LII 1,4% i LSI 7,6%; el metà té LII 5% i LSI 15%. Quina substància presenta MAJOR risc d'inflamació i per quin motiu?",o:["A) La gasolina, perquè forma mescles inflamables en concentracions molt baixes (LII molt baix = major risc)","B) El metà, perquè té un LSI molt superior que amplia la zona de risc per dalt","C) Les dues son igualment perilloses perquè les diferències de LII i LSI es compensen","D) Cap de les dues, perquè els rangs d'inflamabilitat son similars en termes absoluts"],c:0,e:"GASOLINA: LII = 1,4% → en concentracions molt baixes (1,4% en aire) ja és inflamable. METÀ: LII = 5% → necessita 3,5 vegades més concentració per ser inflamable. Un LII MÉS BAIX implica major risc perquè formes mescles perilloses en entorns poc contaminats."},
{t:9,p:"Un foc de classe B (líquids inflamables) no genera brases. Quina és la raó tècnica?",o:["A) Perquè els líquids cremen a temperatura inferior als sòlids","B) Perquè l'extinció per escuma és sempre eficaç abans que es formin brases","C) Perquè els líquids no formen capes carbonoses en cremar: vaporitzen directament sense deixar residu incandescent","D) Perquè els líquids no generen piròlisi, a diferència dels sòlids"],c:2,e:"Els líquids VAPORITZEN per cremar (no passen per piròlisi com els sòlids). No formen la capa carbonosa porosa que reté oxigen i constitueix les brases dels focs classe A. En consumir-se el vapor, no queda material incandescent residual."},
{t:9,p:"El LII de l'amoníac és del 16% i el del gasoil del 0,6%. Quina conclusió operativa és correcta?",o:["A) El gasoil és molt menys perillós que l'amoníac, ja que el seu LII és molt baix","B) L'amoníac és menys perillós que el gasoil perquè necessita alta concentració per ser inflamable","C) El gasoil és molt més perillós quant a risc d'inflamació: forma mescles inflamables amb concentracions de vapor molt baixes","D) La comparació de LII no és vàlida per comparar perillositats entre substàncies de diferent naturalesa"],c:2,e:"GASOIL LII = 0,6% → amb menys del 1% de vapors en l'aire ja és inflamable. AMONÍAC LII = 16% → necessita una concentració molt alta (16%) per ser inflamable. El gasoil presenta un risc d'inflamació molt superior per la concentració mínima necessària."},
{t:9,p:"Quina és la diferència clau entre el punt d'inflamació i el punt d'AUTOIGNICIÓ d'una substància?",o:["A) El punt d'inflamació requereix una font externa d'ignició i és inferior al d'autoignició; el d'autoignició es produeix espontàniament","B) El punt d'autoignició és sempre inferior al d'inflamació","C) El punt d'inflamació i el d'autoignició son idèntics en substàncies sòlides","D) El punt d'inflamació s'aplica a gasos i el d'autoignició a líquids"],c:0,e:"El punt d'inflamació: necessita font d'ignició externa; temperatura inferior. El punt d'AUTOIGNICIÓ: la substància s'inflama espontàniament sense font externa, únicament per la temperatura ambiental. L'autoignició és sempre superior al punt d'inflamació i al de combustió."},
{t:9,p:"Durant la fase de creixement d'un incendi interior, l'estrat superior de gasos calents presenta pressió superior a l'exterior. Quina conseqüència directa en deriva?",o:["A) Que els gasos tendeixen a entrar per les obertures baixes, fent-les perilloses d'obrir","B) Que els gasos calents tendeixen a sortir per qualsevol obertura disponible a NIVELL ALT (escletxes, finestres superiors)","C) Que la pressió positiva superior manté l'estrat inferior net, facilitant l'evacuació","D) Que el pla neutre puja fins al sostre, permetent la progressió per tota l'alçada del recinte"],c:1,e:"Estrat SUPERIOR: pressió positiva → els gasos calents tendeixen a SORTIR per obertures altes. Estrat INFERIOR: pressió negativa → l'aire exterior tendeix a entrar per obertures baixes. D'aquí la importància del pla neutre com a referència de progressió."},
{t:9,p:"La combustió de sofre (S) en presència d'oxigen genera com a producte principal:",o:["A) Monòxid de sofre (SO)","B) Diòxid de sofre (SO₂), responsable del fum de color groguenc","C) Àcid sulfúric (H₂SO₄)","D) Sulfur d'hidrogen (H₂S)"],c:1,e:"La reacció és S + O₂ → SO₂ (diòxid de sofre). El SO₂ és un gas irritant i tòxic, reconeixible per l'olor acre i el fum de color GROC que produeix en la combustió de substàncies amb sofre."},
{t:9,p:"L'acetilè presenta un rang d'inflamabilitat del 2,5% fins a quin LSI aproximat?",o:["A) 81%, però sense LSI real definit perquè l'acetilè es pot descompondre explosivament sense oxigen","B) 50%","C) 25%","D) 12,8%"],c:0,e:"Acetilè: LII = 2,5%, LSI nominal = 81%, però SENSE LSI real definit. Pot descompondre's explosivament fins i tot sense oxigen. Per això es manipula dissolt en acetona dins d'ampolles amb material porós, evitant l'acumulació de gas lliure."},
{t:9,p:"En quina fase del procés tèrmic d'un sòlid es produeix l'eliminació de la humitat?",o:["A) Piròlisi","B) Combustió","C) Assecat","D) Reducció"],c:2,e:"La seqüència és: ASSECAT (eliminació d'humitat) → Piròlisi → Combustió → Reducció. L'assecat és el primer pas perquè l'humitat present en el material ha d'evaporar-se abans que comenci la descomposició tèrmica."},
{t:9,p:"Un 'conat' d'incendi es defineix com:",o:["A) Un incendi d'envergadura que supera els 1.000 m² de superfície","B) Un incendi que afecta la totalitat d'una estructura","C) Un incendi de dimensions petites sofocable ràpidament amb extintors portàtils estàndard","D) Un incendi parcial que afecta menys del 50% de l'edificació"],c:2,e:"CONAT: incendi de dimensions petites, que pot ser sofocat ràpidament amb extintors portàtils estàndard. No compromet l'estructura ni genera risc greu si es controla a temps. Diferent de l'incendi parcial (part de la instal·lació) i del total (tota l'estructura)."},
{t:9,p:"Quina afirmació sobre els focs de metalls combustibles (classe D) és INCORRECTA?",o:["A) L'alumini en pols o encenalls pot cremar tot i que en estat massís no és combustible","B) L'agua és el principal agent extintor recomanat per refredar ràpidament el metall en combustió","C) Alguns metalls combustibles poden descompondre l'agua generant hidrogen amb risc d'explosió","D) Requereixen agents extintors específics com grafit, talc o pols secs específics"],c:1,e:"INCORRECTE: l'agua MAI s'ha d'usar en focs de classe D. Alguns metalls (sodi, potassi, magnesi) reaccionen violentament amb l'agua, descomponent-la en hidrogen (H₂) i alliberant molta calor, amb risc d'explosió. L'opció B és la falsa."},
{t:9,p:"La classificació de 'focs verticals' implica que:",o:["A) El foc es propaga exclusivament en sentit vertical, per convecció","B) L'incendi es manifesta sobre un pla horitzontal i és observable des de qualsevol punt","C) L'incendi es propaga en diversos plans —horitzontals, inclinats o verticals— i part del foc pot quedar oculta a l'observador, dificultant la valoració","D) El foc únicament afecta estructures verticals com columnes i murs de càrrega"],c:2,e:"Focs VERTICALS: l'incendi es propaga en DIVERSOS PLANS (horitzontals, inclinats o verticals). Part del foc pot quedar oculta, dificultant la valoració ràpida. Exemple: bales de palla apilades. Contrastat amb focs plans (pla horitzontal, observable des de qualsevol punt)."},
{t:9,p:"Quin és el LII del propà i del butà respectivament?",o:["A) Propà 1,8% i Butà 2,1%","B) Propà 5% i Butà 3%","C) Propà 2,1% i Butà 1,8%","D) Propà 3,3% i Butà 4%"],c:2,e:"Propà: LII = 2,1%, LSI = 9,5%. Butà: LII = 1,8%, LSI = 8,4%. El butà és lleugerament més inflamable (LII més baix). Ambdós son GLP (gasos liquats del petroli), molt comuns en instal·lacions domèstiques i industrials."},
{t:9,p:"Si la concentració d'oxigen en l'atmosfera és del 40%, quina és la velocitat de combustió respecte a les condicions normals (21% O₂)?",o:["A) Es dobla","B) Es triplica","C) Es quadruplica","D) Es multiplica per vuit"],c:2,e:"Amb 24% O₂ → foc el doble de ràpid. Amb 40% O₂ → foc QUADRUPLICAT en velocitat. Implicació operativa crítica en entorns amb oxigen enriquit (quiròfans, soldadura oxiacetilènica, fuites d'oxigen medicinal)."},
// TEMA 10
{t:10,p:"Quins són els quatre mètodes d'extinció d'incendis?",o:["A) Dilució, sufocació, refredament i absorció","B) Evacuació, contenció, refredament i separació","C) Refredament, sufocació, separació del combustible i inhibició de la reacció en cadena","D) Refredament, oxidació, separació del combustible i neutralització química"],c:2,e:"Els quatre mètodes: 1) Refredament (baixar temperatura), 2) Sufocació (reduir/eliminar O2), 3) Separació del combustible, 4) Inhibició (trencar la reacció en cadena eliminant radicals lliures)."},
{t:10,p:"El mecanisme de refredament en l'extinció actua:",o:["A) Eliminant l'oxigen del recinte","B) Absorbint la calor del combustible per reduir la seva temperatura per sota del punt d'ignició","C) Creant una barrera física entre combustible i comburent","D) Inhibint la reacció en cadena per acció química"],c:1,e:"Refredament = absorbir calor per baixar la temperatura del combustible per sota del punt d'inflamació. L'agent per excel·lència és l'aigua, per la seva elevada capacitat calorífica."},
{t:10,p:"La inhibició com a mètode d'extinció actua de quina manera?",o:["A) Trencant la reacció en cadena eliminant els radicals lliures necessaris per a la propagació de la combustió","B) Creant una capa aïllant que impedeix el contacte entre combustible i comburent","C) Absorbint la calor per sota del punt d'autoignició","D) Reduint la concentració d'oxigen per sota del 12-15%"],c:0,e:"Inhibició = actua en el quart vèrtex del tetraedre: trenca la REACCIÓ EN CADENA eliminant els radicals lliures intermediaris. Agents: hidrocarburs halogenats i, parcialment, la pols."},
{t:10,p:"La pols polivalent ABC és adequada per a quines classes de foc?",o:["A) Classes A, B i C","B) Classes B i C únicament","C) Classes A, B, C i D","D) Classes A, B, C i F/K"],c:0,e:"Pols ABC (polivalent): adequada per a classes A (sòlids), B (líquids) i C (gasos). NO per a classe D (metalls) ni F/K (greixos de cuina)."},
{t:10,p:"L'escuma física com a agent extintor és adequada per a:",o:["A) Classes A, B i C","B) Classes B i C","C) Classes A i B","D) Únicament classe B"],c:2,e:"Escuma física: adequada per a classes A (refredament i separació) i B (sufocació per barrera). No apta per a gasos (C) ni metalls (D)."},
{t:10,p:"La pols BC (convencional) no és adequada per a quin tipus de foc, a diferència de la pols ABC?",o:["A) Classe A — focs de sòlids que formen brases","B) Classe B — focs de líquids inflamables","C) Classe C — focs de gasos inflamables","D) Classe F/K — focs d'olis i greixos de cuina"],c:0,e:"Pols BC: adequada per a classes B (molt adequada) i C (adequada), però NO per a classe A, perquè no actua sobre les brases residuals. La pols ABC sí cobreix la classe A."},
{t:10,p:"Els humectants actuen reduint:",o:["A) La viscositat de l'agua per facilitar la dispersió","B) La temperatura de congelació de l'agua","C) La densitat de l'agua per augmentar el volum de cobertura","D) La tensió superficial de l'agua, augmentant la penetració en materials sòlids porosos"],c:3,e:"Humectants = redueixen la TENSIÓ SUPERFICIAL de l'agua, permetent que penetri millor en materials sòlids porosos. Especialment útils en focs de classe A."},
{t:10,p:"Els espessants o viscosants actuen augmentant:",o:["A) La temperatura de vaporització de l'agua","B) La viscositat de l'agua, fent que s'adhereixi millor al material en combustió","C) La conductivitat tèrmica de l'agua","D) El pH de l'agua per neutralitzar àcids"],c:1,e:"Espessants = augmenten la VISCOSITAT de l'agua, que s'adhereix al combustible. Útils en incendis forestals i líquids insolubles en agua. Atenció: els espessants son tòxics."},
{t:10,p:"L'agua amb borats s'utilitza principalment en:",o:["A) Incendis de gasos inflamables en instal·lacions industrials","B) Incendis de líquids en grans dipòsits","C) Incendis forestals, on forma una barrera vidriosa i ignífuga sobre la vegetació","D) Incendis elèctrics de baixa tensió"],c:2,e:"Borats: ús quasi exclusiu en incendis forestals. Amb la calor, l'agua s'evapora i els cristalls de borat s'esponjen i fonen en forma vidriosa i dura, creant una barrera aïllant."},
{t:10,p:"Els gasos inerts (IG-01, IG-55, IG-541) com a agents extintors:",o:["A) Sempre s'instal·len com a sistemes fixos d'inundació total i mai s'utilitzen com a extintors portàtils","B) Es poden usar en extintors portàtils per a focs de classe B en espais tancats","C) Son el substitut actual dels halons en qualsevol aplicació portàtil","D) S'utilitzen exclusivament en aeronaus i vehicles blindats"],c:0,e:"Gasos inerts: SEMPRE sistemes fixos d'inundació total. Mai extintors portàtils. La seva eficàcia depèn de la concentració en un espai tancat; a l'exterior es dissipa sense efecte."},
{t:10,p:"Per quin motiu no és adequat el CO₂ ni els gasos inerts per a focs de classe F/K?",o:["A) Perquè reaccionen violentament amb els olis","B) Perquè la seva densitat els fa acumular al terra, allunyant-se del focus","C) Perquè no deixen barrera física ni residu un cop es dissipa el gas, i l'oli podria reencendre's","D) Perquè el CO₂ augmenta la temperatura de l'oli en reaccionar amb els àcids grassos"],c:2,e:"CO₂ i gasos inerts: no deixen cap residu ni barrera física. En focs F/K, l'oli segueix a temperatura molt superior al punt d'autoignició; en reingressar O2 s'encendria novament."},
{t:10,p:"Quin és el fonament del mètode d'extinció per sufocació?",o:["A) Eliminar el combustible fins que no hi hagi prou matèria per mantenir la flama","B) Reduir la concentració d'oxigen per sota del 12-15% fins que la flama s'extingeixi","C) Aplicar un agent que trenci la cadena de radicals lliures","D) Absorbir tanta calor que la temperatura caigui per sota del punt d'inflamació"],c:1,e:"Sufocació = reduir l'O2 per sota del llindar mínim de combustió (12-15%). S'elimina el COMBURENT, no el combustible ni la calor."},
{t:10,p:"La taula d'adequació d'agents extintors per classe de foc es basa en la norma:",o:["A) ISO 9001 de gestió de qualitat en serveis d'emergència","B) EN 13501-1 de reacció al foc de materials de construcció","C) UNE 23/010 de classificació de focs i adequació d'agents extintors","D) RIPCI (RD 513/2017) d'instal·lacions de protecció contra incendis"],c:2,e:"La taula d'adequació d'agents extintors per classe de foc es basa en la norma UNE 23/010."},
{t:10,p:"L'anhídrid carbònic (CO₂) és acceptable per a quines classes de foc i NO adequat per a quines?",o:["A) Adequat per a classe A; no adequat per a classe B","B) Acceptable per a classes A i B; no adequat per a classes D ni F/K","C) Adequat per a classes B i C; no adequat per a classe A","D) Adequat per a totes les classes excepte la D"],c:1,e:"CO₂: acceptable (no 'molt adequat') per a classes A i B. No adequat per a classes D (metalls) ni F/K (greixos de cuina)."},
{t:10,p:"Per quins dos motius els additius espessants s'han d'usar amb precaució?",o:["A) Perquè redueixen la temperatura d'ebullició de l'agua i la fan menys eficaç","B) Perquè son tòxics i acceleren la corrosió dels equips","C) Perquè son tòxics i provoquen contaminació del medi si no es gestionen adequadament","D) Perquè redueixen la pressió de les mànegues i dificulten la projecció"],c:2,e:"Espessants: tòxics + potencial contaminació del medi ambient. Els humectants també poden ser tòxics o corrosius i han de ser homologats ambientalment."},
// TEMA 10 — preguntes addicionals dificultat alta
{t:10,p:"Quina és la calor latent de vaporització de l'agua i per quin motiu és la propietat MÉS rellevant com a agent extintor?",o:["A) 80 cal/g; és la calor que absorbeix quan es fon","B) 1 cal/g·°C; és el calor específic que determina l'escalfament progressiu","C) 540 cal/g; en vaporitzar-se, cada gram absorbeix 540 calories directament del combustible","D) 374 kcal/g; és la calor alliberada a la temperatura crítica"],c:2,e:"Calor latent de vaporització = 540 cal/g. És la propietat clau perquè en vaporitzar-se, cada gram d'agua absorbeix 540 calories del combustible. El calor específic (1 cal/g·°C) i la calor de fusió (80 cal/g) son molt inferiors i menys rellevants per a l'extinció."},
{t:10,p:"L'agua polvoritzada refreda quantes vegades més que la mateixa quantitat d'agua aplicada a xorro compacte?",o:["A) 2,5 vegades més","B) 4,1 vegades més","C) 7,3 vegades més","D) 12 vegades més"],c:2,e:"L'agua polvoritzada refreda 7,3 VEGADES MÉS que el xorro compacte. Motiu: polvoritzar l'agua en gotes petites augmenta enormement la superfície total de contacte amb el foc, fent l'intercanvi de calor molt més eficient."},
{t:10,p:"En quina proporció aproximada augmenta el volum de l'agua quan es vaporitza completament?",o:["A) ~170 vegades","B) ~540 vegades","C) ~1.000 vegades","D) ~1.700 vegades"],c:3,e:"Un litre d'agua líquida es converteix en ~1.700 litres de vapor en vaporitzar-se completament. Aquesta expansió és la base del mecanisme d'INERTITZACIÓ: el vapor desplaça l'aire del recinte i dilueix l'oxigen."},
{t:10,p:"La tensió superficial de l'agua és de 73 mN/m. Quina implicació pràctica en deriva per a l'extinció?",o:["A) Fa que l'agua sigui molt viscosa i difícil de bombejar a pressió elevada","B) Millora la penetració en materials porosos sense necessitat d'additius","C) L'agua penetra malament en materials porosos (fusta, paper), i per això calen additius humectants","D) Provoca que l'agua formi gotes molt grans, reduint la superfície de contacte amb el foc"],c:2,e:"La tensió superficial elevada (73 mN/m) fa que l'agua no penetri bé en materials sòlids porosos com fusta o paper. Per millorar-ho s'usen additius HUMECTANTS, que redueixen la tensió superficial i augmenten la penetració."},
{t:10,p:"El mecanisme d'inertització de l'agua en un recinte tancat funciona perquè:",o:["A) L'agua absorbeix el CO generant CO2 que actua com a agent extintor real","B) El vapor generat (~1.700x el volum original) desplaça l'aire i dilueix la concentració d'oxigen de tot l'espai","C) L'agua reacciona químicament amb els radicals lliures de la reacció en cadena","D) L'agua refreda els gasos fins al punt de rosada, condensant-los i eliminant-los"],c:1,e:"Inertització: el vapor d'agua ocupa ~1.700 vegades el volum de l'agua líquida original, desplaçant l'aire del recinte i diluint l'oxigen. No és el mateix que la sofocació (que implica separació física completa)."},
{t:10,p:"Per a un foc de líquids polars com l'etanol, quin mecanisme principal utilitza l'agua per extingir-lo?",o:["A) Sofocació: l'agua forma una capa física sobre l'etanol que n'impedeix la vaporització","B) Dilució: l'agua es dissol amb l'etanol, baixant la concentració de vapors inflamables per sota del LII","C) Emulsió: l'agua forma gotetes en suspensió dins l'etanol que n'impedeixen la combustió","D) Inhibició química: l'agua trenca la reacció en cadena en contacte amb els vapors alcohòlics"],c:1,e:"Per a líquids POLARS (miscibles en agua, com l'etanol): el mecanisme és la DILUCIÓ. L'agua es barreja amb l'alcohol i, si n'hi ha prou, la concentració de vapors inflamables baixa per sota del LII. Per a líquids no polars (benzina), s'usa l'emulsió."},
{t:10,p:"Quins quatre elements formen el 'tetraedre de l'escuma', en analogia amb el tetraedre del foc?",o:["A) Combustible, comburent, calor i reacció química","B) Espumógeno, agua, CO2 i pressió de bombeig","C) Aire, agua, concentrat espumógeno i agitació mecànica","D) Concentrat, agua, nitrogen i pressió de la bomba del vehicle"],c:2,e:"El TETRAEDRE DE L'ESCUMA té quatre components: AIRE + AGUA + CONCENTRAT (espumógeno) + AGITACIÓ MECÀNICA. Si falta qualsevol dels quatre (per exemple, agitació insuficient), no s'obté escuma real, sinó simplement un líquid ensabonat."},
{t:10,p:"Un espumógeno 'del 3%' és, respecte a un 'del 6%':",o:["A) Menys concentrat, ja que necessita menys quantitat per aconseguir el mateix resultat","B) Més concentrat: necessites menys quantitat de producte (3 L per cada 100 L de mescla) per al mateix resultat extintor","C) Equivalent en efectivitat; la diferència és purament nominal","D) Menys efectiu, perquè el percentatge indica directament el poder extintor del producte"],c:1,e:"PARADOXA IMPORTANT: un espumógeno del 3% és MÉS concentrat que un del 6%, perquè necessites menys volum de concentrat per aconseguir el mateix resultat. El percentatge indica la dosificació, no la concentració del producte."},
{t:10,p:"Quins son els rangs de coeficient d'expansió per a escuma baixa, mitjana i alta?",o:["A) <10:1 / 10:1-100:1 / 100:1-500:1","B) <20:1 / 20:1-200:1 / 200:1-1.000:1","C) <50:1 / 50:1-500:1 / >500:1","D) <5:1 / 5:1-50:1 / 50:1-1.000:1"],c:1,e:"Escuma BAIXA: fins a 20:1. Escuma MITJANA: 20:1 – 200:1. Escuma ALTA: 200:1 – 1.000:1. Com més elevat el coeficient d'expansió, menys agua conté per litre d'escuma i menys densa és."},
{t:10,p:"La dosificació d'un espumógeno polivalent (AR) difereix entre líquids polars i hidrocarburs. Quina combinació és correcta?",o:["A) 3% per a polars i 6% per a hidrocarburs","B) 6% per a polars i 3% per a hidrocarburs","C) 3% per als dos tipus","D) 6% per als dos tipus"],c:1,e:"Espumógeno AR (polivalent): 3% per a HIDROCARBURS i 6% per a POLARS (solvents, alcohòls). Els líquids polars degraden l'escuma convencional, per la qual cosa calen concentracions majors."},
{t:10,p:"La barreja accidental de pols ABC (fosfat monoamònic, ÀCIDA) amb pols BC (bicarbonat, ALCALINA) dins d'un extintor tancat pot provocar:",o:["A) Una reacció exotèrmica que ignita la pols","B) Una reacció de neutralització inofensiva que redueix l'efectivitat","C) Una explosió física per sobrepressió: la reacció àcid-base genera CO2 ràpidament i la pressió interna pot rebentar el cilindre","D) Una reacció d'inhibició que inutilitza completament els dos agents"],c:2,e:"La mescla àcid (fosfat monoamònic) + base (bicarbonat) genera CO2 de forma ràpida (com el 'volcà' escolar amb bicarbonat i vinagre). En un cilindre tancat, la sobrepressió pot rebentar-lo mecànicament. El CO2 en si no és perillós; el perill és l'EXPLOSIÓ FÍSICA per sobrepressió."},
{t:10,p:"Quin gas auxiliar s'utilitza habitualment per impulsar la pols química, que no té pressió pròpia?",o:["A) Oxigen comprimit","B) Aire comprimit filtrat","C) Nitrogen sec o diòxid de carboni","D) Argó o heli"],c:2,e:"La pols química NO té pressió pròpia: cal un gas auxiliar (típicament NITROGEN sec o CO2) per impulsar-la cap al foc. Sense aquest gas pressuritzador, la pols no sortirà del recipient."},
{t:10,p:"La temperatura màxima d'emmagatzematge recomanada per a la pols química és:",o:["A) 30°C","B) 40°C","C) 49°C","D) 60°C"],c:2,e:"La pols química no s'ha d'emmagatzemar per sobre de 49°C. A temperatures molt altes, alguns additius (estearats metàl·lics, silicones) poden fondre's i tornar el material enganxós o formargrumos, inutilitzant l'agent."},
{t:10,p:"Quin extintor de 10 kg té el MAJOR potencial d'extinció per a focs de classe B?",o:["A) Bicarbonat sòdic (BC estàndard, 'rogenc') → 40B","B) Fosfat monoamònic (pols ABC polivalent) → 60B","C) Bicarbonat potàssic ('Púrpura K') → 80B","D) Clorur potàssic ('Super-K') → 70B"],c:2,e:"10 kg de bicarbonat potàssic ('Púrpura K') = 80B. 10 kg de fosfat monoamònic (ABC) = 60B. 10 kg de bicarbonat sòdic (BC estàndard) = 40B. La mateixa massa, però doble potencial extintor canviant la sal base."},
{t:10,p:"Quina pols química s'identifica pel color ROGENC i es comercialitza com a 'BC estàndard'?",o:["A) Bicarbonat potàssic ('Púrpura K')","B) Fosfat monoamònic (pols polivalent)","C) Clorur potàssic ('Super-K')","D) Bicarbonat sòdic"],c:3,e:"BICARBONAT SÒDIC = BC estàndard, COLOR ROGENC. BICARBONAT POTÀSSIC = 'Púrpura K', color púrpura. CLORUR POTÀSSIC = 'Super-K'. FOSFAT MONOAMÒNIC = base de les pols polivalents ABC."},
{t:10,p:"La densitat del CO₂ com a agent extintor respecte a l'aire és aproximadament:",o:["A) 0,5 vegades (és més lleuger que l'aire)","B) Equivalent a l'aire (densitat 1:1)","C) 1,5 vegades (és més pesat que l'aire)","D) 5 vegades (molt més pesat que l'aire)"],c:2,e:"CO₂: densitat 1,5 VEGADES l'aire. Per això tendeix a acumular-se en zones baixes (soterranis, desguassos), cosa que té implicacions de seguretat per al personal actuant. La densitat x5 correspon als HALONS en estat líquid."},
{t:10,p:"A quina concentració de CO₂ en l'ambient es produeix pèrdua de consciència RÀPIDA en persones?",o:["A) Per sobre del 3%","B) Per sobre del 6-7% (on apareixen efectes evidents com vertigens)","C) Per sobre del 9%","D) Per sobre del 15%"],c:2,e:"CO₂ en l'ambient: efectes evidents (vertigens, cefalea) a partir del 6-7%. PÈRDUA DE CONSCIÈNCIA RÀPIDA: per sobre del 9%. Per sota del 3%, efectes mínims. Per damunt del 15%, risc de mort ràpida."},
{t:10,p:"La concentració extintora del CO₂ per a focs SUPERFICIALS és del:",o:["A) 10-15%","B) 20-25%","C) 30-38%","D) 50-61%"],c:2,e:"CO₂ concentració extintora: 30-38% per a focs SUPERFICIALS. Per a focs en profunditat (arxius, dipòsits de paper), la concentració necessària pot arribar fins al 61%, perquè el CO₂ ha de penetrar en les brases."},
{t:10,p:"Per a focs en arxius i dipòsits de paper (combustible en profunditat), la concentració extintora de CO₂ pot arribar fins a:",o:["A) 38%","B) 45%","C) 55%","D) 61%"],c:3,e:"Focs en PROFUNDITAT (paper, arxius): CO₂ necessita arribar al 61% de concentració per extingir les brases interiors. En focs superficials, el 30-38% és suficient. Diferència crítica per al disseny de sistemes fixos."},
{t:10,p:"La diferència clau en l'aplicació pràctica entre el Haló 1211 i el Haló 1301 és:",o:["A) El 1211 s'aplica en sistemes fixos d'inundació total; el 1301 en extintors portàtils","B) El 1211 surt en forma LÍQUIDA (punt ebullició -4°C, major distància de projecció); el 1301 surt GASÓS (punt ebullició -59°C, usat en inundació total)","C) El 1211 és dielèctric i no deixa residu; el 1301 sí que deixa residu","D) El 1211 és adequat per a classe F/K; el 1301 no"],c:1,e:"Haló 1211: punt ebullició -4°C → surt majoritàriament LÍQUID → pot projectar-se a més distància (extintors portàtils). Haló 1301: punt ebullició -59°C → surt completament GASÓS → sistemes fixos d'inundació total."},
{t:10,p:"Quines tres propietats fan que els halons siguin ideals per protegir equips electrònics delicats?",o:["A) Son conductors, deixen residu i son corrosius","B) Son dielèctrics, no deixen residus i no son corrosius ni abrasius","C) Son biodegradables, reciclables i no tòxics","D) Son lleugers, s'evaporen ràpid i son totalment inerts ambientalment"],c:1,e:"Halons = agents 'nets': DIELÈCTRICS (no condueixen l'electricitat), NO deixen RESIDUS i NO son CORROSIUS ni abrasius. Per això son ideals per a sales d'ordinadors, sistemes electrònics i equips delicats. El seu inconvenient és mediambiental (destrucció de la capa d'ozó)."},
{t:10,p:"La densitat dels halons en estat líquid respecte a l'aire és aproximadament:",o:["A) 1,5 vegades","B) 2,5 vegades","C) 3,5 vegades","D) 5 vegades"],c:3,e:"Halons en estat líquid: densitat ~5 VEGADES l'aire. Això permet emmagatzemar-ne grans quantitats en volums relativament petits i assegura que, en descarregar-se, es mantenen en la zona d'actuació. La densitat x1,5 correspon al CO₂ gasós."},
{t:10,p:"L'IG-541 ('Inergen') és una barreja de gasos. Quina és la seva composició exacta?",o:["A) 50% nitrogen + 50% argó","B) 40% nitrogen + 50% argó + 10% CO₂","C) 52% nitrogen + 40% argó + 8% CO₂","D) 60% nitrogen + 36% argó + 4% CO₂"],c:2,e:"IG-541 ('Inergen') = 52% N₂ + 40% Ar + 8% CO₂. El 8% de CO₂ és rellevant: estimula la respiració, compensant parcialment l'efecte de la reducció d'oxigen. Temps de descàrrega: 60-90 segons. Concentració extintora: 40-80%."},
{t:10,p:"En l'aplicació de l'IG-541, quines son les condicions de seguretat mínimes per a la zona d'extinció?",o:["A) Mínim 18% d'O₂ i màxim 2% de CO₂","B) Mínim 14% d'O₂ i màxim 4% de CO₂","C) Mínim 12% d'O₂ i màxim 6% de CO₂","D) Mínim 10% d'O₂ i màxim 8% de CO₂"],c:1,e:"IG-541: condicions de seguretat mínimes = MÍNIM 14% d'O₂ i MÀXIM 4% de CO₂ en l'ambient de la zona. Per sota d'aquests valors, el risc per a persones és inacceptable."},
{t:10,p:"L'IG-55 és una mescla de:",o:["A) Nitrogen pur (100%)","B) Nitrogen i CO₂ a parts iguals","C) Nitrogen i argó a parts iguals","D) Argó i CO₂ en proporció 80:20"],c:2,e:"IG-55 = NITROGEN + ARGÓ a parts iguals (50% + 50%). Redueix l'O₂ del 21% normal fins al 11-13%. No deixa residu, no és conductor ni corrosiu. L'IG-100 és nitrogen pur; l'IG-01 és argó pur."},
{t:10,p:"Els gasos halocarbonats (HFCs), com a alternativa als halons, es diferencien d'aquests perquè:",o:["A) Contenen brom, que és l'element que els dóna l'efectivitat extintora","B) No contenen brom (contenen flúor, clor o iode); son menys efectius i requereixen concentracions més altes","C) Son idèntics en composició als halons però amb nom comercial diferent","D) Son exclusivament gasos inerts sense cap component halogenat"],c:1,e:"Halocarbonats (HFCs): contenen flúor, clor o iode, però MAI BROM. El brom és l'element que feia els halons tan efectius però tan nocius per a la capa d'ozó. Sense brom, son menys efectius: calen concentracions més altes."},
{t:10,p:"En quina situació és la pols ABC (polivalent) MENYS eficaç malgrat ser adequada per a classe A?",o:["A) En focs de classe B de gran superfície","B) En focs de classe C a l'interior de conduccions","C) En focs de classe A amb combustible en profunditat (brases), perquè l'acció de la pols és essencialment superficial","D) En focs de classe F/K perquè el fosfat monoamònic reacciona amb els olis"],c:2,e:"La pols ABC actua sobre la SUPERFÍCIE del combustible. Per a focs en PROFUNDITAT (brases, paper acumulat) la seva acció és molt limitada i cal complementar-la amb agua polvoritzada per penetrar en les brases interiors."},
{t:10,p:"La pols química és INCOMPATIBLE amb la majoria d'escumes extintores. Quina és l'única escuma que sí és compatible?",o:["A) Escuma d'alta expansió (coeficient >200:1)","B) Escuma de proteïna fluorada (FP)","C) Escuma AFFF (Aqueous Film Forming Foam)","D) Escuma de medi pH àcid"],c:2,e:"La pols química (BC alcalina) destrueix la majoria d'escumes al trencar les bombolles. L'única excepció és l'escuma AFFF (Aqueous Film Forming Foam), que és compatible amb la pols i permet l'atac simultani o combinat."},
{t:10,p:"La taxa mínima d'aplicació d'escuma per a HIDROCARBURS (focs classe B estàndard) és de:",o:["A) 2 L/min·m²","B) 4 L/min·m²","C) 6 L/min·m²","D) 8 L/min·m²"],c:1,e:"Taxa mínima aplicació escuma: HIDROCARBURS = 4 L/min·m². POLARS (alcohòls, solvents) = 6 L/min·m², perquè degraden l'escuma més ràpid i cal reposar-la a major velocitat."},
{t:10,p:"Quina és la pressió de treball habitual de les llances d'escuma de BAIXA expansió?",o:["A) 2,5-3 bar","B) 3-4 bar","C) 6-7 bar","D) 10-12 bar"],c:2,e:"Llances d'escuma de BAIXA expansió: pressió de treball 6-7 bar. Llances de MITJANA expansió: 3-4 bar (o 2,5-3 bar). Regla general: les llances de baixa expansió treballen a pressió més alta que les de mitjana."},
{t:10,p:"La calor latent de FUSIÓ de l'agua (canvi de gel a líquid) és:",o:["A) 540 cal/g","B) 80 cal/g","C) 1 cal/g·°C","D) 374 kcal/g"],c:1,e:"Calor latent de FUSIÓ = 80 cal/g. Calor latent de VAPORITZACIÓ = 540 cal/g. Calor específic = 1 cal/g·°C. La vaporització (540) absorbeix 6,75 vegades més energia que la fusió (80), per això l'agua és tan eficaç refredant en extincions amb flama."},
{t:10,p:"El CO₂ en descàrrega pot formar 'neu carbònica'. A quina temperatura es produeix la sublimació del CO₂ sòlid?",o:["A) A -40°C (punt de gasificació del líquid)","B) A -59°C","C) A -79°C (punt de sublimació del CO₂ sòlid)","D) A -100°C"],c:2,e:"CO₂: punt de GASIFICACIÓ del líquid = -40°C. Punt de SUBLIMACIÓ del CO₂ sòlid (neu carbònica) = -79°C. La 'neu carbònica' que es forma durant la descàrrega és una propietat, no un defecte: augmenta la capacitat de refredament."},
{t:10,p:"La diferència conceptual exacta entre 'agent extintor' i 'extintor' és:",o:["A) Son sinònims que s'usen indistintament en el vocabulari tècnic de bombers","B) L'extintor és la substància que apaga el foc; l'agent extintor és el recipient que la conté","C) L'agent extintor és la substància que apaga el foc; l'extintor és el recipient que la conté i la projecta","D) L'agent extintor és un producte industrial; l'extintor és la versió d'ús domèstic"],c:2,e:"AGENT EXTINTOR = la substància que realment apaga el foc (agua, pols, CO₂...). EXTINTOR = el recipient o cilindre que conté l'agent i el projecta cap al foc. Un extintor de pols ABC conté pols (agent) dins del cilindre (extintor)."},
